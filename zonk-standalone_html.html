/* =========================================================== PROFILE */
async function mountProfile(view) {
  const scroll = el('div', { class: 'view-scroll' });
  const phone = el('div', { class: 'phone-col' });
  scroll.append(phone);
  view.append(scroll);

  let target = null;
  try {
    if (S.params.id) target = await profiles.get(S.params.id);
    else if (S.params.username) target = await profiles.byUsername(S.params.username);
    else target = S.profile;
  } catch (e) {
    phone.append(emptyState({ icon: 'flag', title: 'Could not load profile', text: diagnose(e) }));
    return;
  }
  if (!target) {
    phone.append(emptyState({ icon: 'user', title: 'Profile not found', text: 'That account may have been removed.' }));
    return;
  }

  const isMe = target.id === S.user.id;
  const top = el('div', { class: 'topbar' },
    el('button', { class: 'icon-btn', html: icon('back', 22), onclick: () => history.length > 1 ? history.back() : navigate('feed') }),
    el('h2', { text: '@' + target.username }),
    el('div', { class: 'spacer' }),
    isMe ? el('button', { class: 'icon-btn', html: icon('settings', 21), onclick: () => navigate('settings') }) : null,
    !isMe ? el('button', { class: 'icon-btn', html: icon('more', 22), onclick: () => openUserMenu(target) }) : null
  );
  phone.append(top);

  const head = el('div', { class: 'profile-head' },
    el('div', { class: 'profile-top' },
      avatarEl(target, 88, false),
      el('div', { style: { flex: '1' } },
        el('div', { class: 'stat-row' },
          el('div', { class: 'stat' }, el('b', { text: compact(target.post_count) }), el('span', { text: 'posts' })),
          el('button', { class: 'stat', onclick: () => openFollowList(target, 'followers') }, el('b', { text: compact(target.follower_count) }), el('span', { text: 'followers' })),
          el('button', { class: 'stat', onclick: () => openFollowList(target, 'following') }, el('b', { text: compact(target.following_count) }), el('span', { text: 'following' }))
        ),
        el('div', { class: 'stat-row', style: { marginTop: '6px' } },
          el('div', { class: 'stat' }, el('b', { text: compact(target.like_count) }), el('span', { text: 'likes' })))
      )
    ),
    el('h1', { class: 'profile-name', text: target.display_name || target.username }),
    el('p', { class: 'profile-handle', text: '@' + target.username + (target.is_private ? ' · 🔒 private' : '') }),
    target.bio ? el('p', { class: 'profile-bio', text: target.bio }) : null,
    (target.links && target.links.length)
      ? el('div', { class: 'profile-links' }, target.links.map(l =>
        el('a', { href: l.url, target: '_blank', rel: 'noopener noreferrer' },
          iconEl('link', 14), ' ' + (l.label || l.url))))
      : null,
    el('div', { class: 'profile-actions' }, profileActions(target, isMe))
  );
  phone.append(head);

  const TABS = isMe
    ? [['video', 'Videos'], ['meme', 'Memes'], ['liked', 'Liked'], ['saved', 'Saved']]
    : [['video', 'Videos'], ['meme', 'Memes']];
  let tab = TABS[0][0];
  const grid = el('div', { style: { paddingTop: '6px' } });
  const tabsEl = el('div', { class: 'tabs' },
    TABS.map(([k, l]) => el('button', { class: k === tab ? 'active' : '', text: l, dataset: { tab: k }, onclick: (e) => {
      tab = k;
      $$('button', tabsEl).forEach(b => b.classList.toggle('active', b === e.currentTarget));
      loadTab();
    } }))
  );
  phone.append(tabsEl, grid);

  async function loadTab() {
    grid.innerHTML = '';
    grid.append(skeletonList(2, 120));
    try {
      let rows;
      if (tab === 'video') rows = await posts.byAuthor(target.id, 'video');
      else if (tab === 'meme') rows = await posts.byAuthor(target.id, 'meme');
      else if (tab === 'liked') rows = await posts.likedBy(target.id);
      else rows = await posts.savedBy(target.id);
      grid.innerHTML = '';
      if (!rows.length) {
        grid.append(emptyState({
          icon: tab === 'video' ? 'video' : tab === 'meme' ? 'image' : tab === 'liked' ? 'heart' : 'bookmark',
          title: emptyTitle(tab, isMe),
          text: isMe && (tab === 'video' || tab === 'meme') ? 'Your posts will show up here.' : ''
        }));
        if (isMe && (tab === 'video' || tab === 'meme')) {
          grid.querySelector('.empty')?.append(el('div', { style: { marginTop: '14px' } },
            el('button', { class: 'btn btn-primary', text: 'Create your first post', onclick: () => navigate('create') })));
        }
      } else {
        grid.append(tileGrid(rows));
      }
    } catch (e) {
      grid.innerHTML = '';
      grid.append(emptyState({ icon: 'flag', title: 'Could not load posts', text: diagnose(e) }));
    }
  }
  loadTab();
}

function emptyTitle(tab, isMe) {
  if (tab === 'liked') return isMe ? 'Nothing liked yet' : 'No public likes';
  if (tab === 'saved') return 'No saved posts';
  if (tab === 'meme') return isMe ? 'No memes yet' : 'No memes yet';
  return isMe ? 'No videos yet' : 'No videos yet';
}

function profileActions(target, isMe) {
  if (isMe) {
    return [
      el('button', { class: 'btn btn-outline', text: 'Edit profile', onclick: () => openEditProfile() }),
      el('button', { class: 'btn btn-ghost', text: 'Share profile', onclick: async () => {
        const url = `${location.origin}${location.pathname}#profile/${target.username}`;
        try { await navigator.clipboard.writeText(url); toastOk('Profile link copied'); }
        catch { toastErr('Could not copy'); }
      } })
    ];
  }
  const followBtn = el('button', {
    class: `btn ${S.following.has(target.id) ? 'btn-ghost' : 'btn-primary'}`,
    text: S.following.has(target.id) ? 'Following' : 'Follow'
  });
  followBtn.onclick = async () => {
    try {
      const now = await follows.toggle(S.user.id, target.id, S.following.has(target.id));
      now ? S.following.add(target.id) : S.following.delete(target.id);
      followBtn.textContent = now ? 'Following' : 'Follow';
      followBtn.className = `btn ${now ? 'btn-ghost' : 'btn-primary'}`;
      target.follower_count = Math.max(0, (target.follower_count || 0) + (now ? 1 : -1));
      S.feedCache.following = null;
    } catch (e) { toastErr(e.message); }
  };
  return [
    followBtn,
    el('button', { class: 'btn btn-outline', text: 'Message', onclick: async () => {
      try {
        const id = await messaging.getOrCreateDM(target.id);
        navigate('thread', { id });
      } catch (e) { toastErr(e.message); }
    } }),
    el('button', { class: 'btn btn-outline', title: 'Voice call', html: icon('mic', 18) + ' <span>Call</span>',
      onclick: () => startCall(target, 'audio') }),
    el('button', { class: 'btn btn-outline', title: 'Video call', html: icon('cam', 18) + ' <span>Video</span>',
      onclick: () => startCall(target, 'video') })
  ];
}

function openUserMenu(target) {
  const blocked = S.blocked.has(target.id);
  const body = el('div', { class: 'menu' },
    menuBtn('link', 'Copy profile link', async () => {
      await navigator.clipboard.writeText(`${location.origin}${location.pathname}#profile/${target.username}`);
      toastOk('Copied'); closeAll();
    }),
    menuBtn('flag', 'Report user', () => { closeAll(); openReport({ targetType: 'user', targetId: target.id, label: '@' + target.username }); }),
    menuBtn('block', blocked ? 'Unblock user' : 'Block user', async () => {
      closeAll();
      try {
        if (blocked) { await safety.unblock(S.user.id, target.id); S.blocked.delete(target.id); toastOk('Unblocked'); }
        else {
          if (!await confirmDialog({ title: `Block @${target.username}?`, message: 'They won’t appear in your feed, and they can’t message or follow you.', confirmLabel: 'Block', danger: true })) return;
          await safety.block(S.user.id, target.id); S.blocked.add(target.id);
          S.following.delete(target.id); S.feedCache = {};
          toastOk('Blocked');
          navigate('feed');
        }
      } catch (e) { toastErr(e.message); }
    }, !blocked)
  );
  openSheet({ title: '@' + target.username, body });
}

async function openFollowList(target, which) {
  const body = el('div');
  body.append(skeletonList(5, 56));
  openSheet({ title: which === 'followers' ? 'Followers' : 'Following', body });
  try {
    const rows = which === 'followers' ? await profiles.followers(target.id) : await profiles.following(target.id);
    body.innerHTML = '';
    if (!rows.length) body.append(emptyState({ icon: 'users', title: `No ${which} yet`, text: '' }));
    else rows.forEach(u => body.append(userRow(u)));
  } catch (e) {
    body.innerHTML = '';
    body.append(emptyState({ icon: 'flag', title: 'Could not load list', text: diagnose(e) }));
  }
}

function openEditProfile() {
  const p = S.profile;
  let avatarFile = null;
  const preview = avatarEl(p, 88);
  const dname = el('input', { class: 'input', value: p.display_name || '', maxlength: 40 });
  const bio = el('textarea', { class: 'input', maxlength: 160, value: p.bio || '' });
  const links = el('input', { class: 'input', value: (p.links || []).map(l => l.url).join(', '), placeholder: 'yoursite.com, https://x.com/you' });
  const handle = el('input', { class: 'input', value: p.username, maxlength: 24 });
  const hint = el('div', { class: 'hint' });
  const accents = ['#7C5CFF', '#FF4D8D', '#22E0B8', '#FFB020', '#4DA3FF', '#FF6B6B'];
  let accent = p.accent || accents[0];

  const swatches = el('div', { style: { display: 'flex', gap: '10px', marginTop: '4px' } },
    accents.map(c => el('button', {
      style: {
        width: '32px', height: '32px', borderRadius: '99px', background: c,
        outline: c === accent ? '2px solid #fff' : 'none', outlineOffset: '2px'
      },
      onclick: (e) => {
        accent = c;
        $$('button', swatches).forEach(b => b.style.outline = 'none');
        e.currentTarget.style.outline = '2px solid #fff';
      }
    })));

  const body = el('div', {},
    el('div', { style: { display: 'flex', justifyContent: 'center', marginBottom: '18px' } },
      el('button', { style: { position: 'relative' }, onclick: async () => {
        const f = await pickFile('image/*');
        if (!f) return;
        avatarFile = f;
        preview.replaceWith(el('img', { class: 'avatar', src: URL.createObjectURL(f), width: 88, height: 88 }));
      } },
        preview,
        el('span', {
          style: { position: 'absolute', right: 0, bottom: 0, width: '28px', height: '28px', borderRadius: '99px', background: 'var(--grad-brand)', display: 'grid', placeItems: 'center' },
          html: icon('camera', 15)
        }))),
    el('div', { class: 'field' }, el('label', { text: 'Display name' }), dname),
    el('div', { class: 'field' },
      el('label', { text: 'Username' }),
      el('div', { class: 'input-affix' }, el('span', { class: 'at', text: '@' }), handle),
      hint),
    el('div', { class: 'field' }, el('label', { text: 'Bio' }), bio),
    el('div', { class: 'field' }, el('label', { text: 'Links' }), links),
    el('div', { class: 'field' }, el('label', { text: 'Profile accent' }), swatches)
  );

  const save = el('button', { class: 'btn btn-primary', text: 'Save changes' });
  const { modal } = openModal({ title: 'Edit profile', body });
  modal.append(el('div', { style: { marginTop: '20px' } }, save));

  save.onclick = async () => {
    save.disabled = true; save.innerHTML = '<span class="spinner"></span>';
    try {
      const newHandle = handle.value.trim().toLowerCase();
      const patch = {
        display_name: dname.value.trim(),
        bio: bio.value.trim(),
        accent,
        links: links.value.split(',').map(s => s.trim()).filter(Boolean).map(s => ({
          label: s.replace(/^https?:\/\//, '').replace(/^@/, ''),
          url: /^https?:\/\//.test(s) ? s : (/^@/.test(s) ? `https://x.com/${s.slice(1)}` : `https://${s}`)
        }))
      };
      if (newHandle && newHandle !== p.username) {
        if (!/^[a-z0-9_.]{3,24}$/.test(newHandle)) throw new Error('Username must be 3–24 chars: a–z, 0–9, _ or .');
        const ok = await auth.usernameAvailable(newHandle);
        if (!ok) throw new Error('That username is taken.');
        patch.username = newHandle;
      }
      if (avatarFile) patch.avatar_url = await profiles.uploadAvatar(S.user.id, avatarFile);
      S.profile = await profiles.update(S.user.id, patch);
      closeAll();
      toastOk('Profile updated');
      S.feedCache = {};
      renderShell();
    } catch (e) {
      toastErr(e.message || 'Could not save');
    } finally {
      save.disabled = false; save.textContent = 'Save changes';
    }
  };

/* ============================================================ CREATE */
function mountCreate(view) {
  const scroll = el('div', { class: 'view-scroll' });
  const phone = el('div', { class: 'phone-col' });
  scroll.append(phone);
  view.append(scroll);

  let file = null;
  let kind = 'video';
  let progress = 0;

  const MAX_UPLOAD_MB = 100;

  /** Catch the obvious problems here, with a real explanation, instead of
   *  letting a 400 MB phone video upload for two minutes and then fail. */
  function validateUpload(f) {
    if (!f) return 'No file chosen.';
    const isVid = (f.type || '').startsWith('video');
    const isImg = (f.type || '').startsWith('image');
    if (kind === 'video' && !isVid) return 'That is not a video file — choose an MP4, MOV or WebM.';
    if (kind === 'meme' && !isImg) return 'That is not an image — choose a JPG, PNG, GIF or WebP.';
    if (f.size > MAX_UPLOAD_MB * 1048576) {
      return `That file is ${(f.size / 1048576).toFixed(0)} MB. The limit is ${MAX_UPLOAD_MB} MB — trim it or record at a lower quality.`;
    }
    return null;
  }

  /** One entry point for choosing a file, used by the Upload button in the
   *  top bar, the dropzone, and the camera button. */
  async function chooseFile() {
    const f = await pickFile(kind === 'video' ? 'video/*' : 'image/*');
    if (!f) return;
    const problem = validateUpload(f);
    if (problem) return toastErr(problem);
    file = f;
    renderPicker();
  }

  const top = el('div', { class: 'topbar' },
    el('button', { class: 'icon-btn', html: icon('close', 22), onclick: () => history.length > 1 ? history.back() : navigate('feed') }),
    el('h2', { text: 'Create' }),
    el('div', { class: 'spacer' }),
    el('button', { class: 'btn-upload', type: 'button',
      html: icon('upload', 16) + '<span>Upload</span>', onclick: () => chooseFile() })
  );
  phone.append(top);

  const body = el('div', { style: { padding: '16px' } });
  phone.append(body);

  const seg = el('div', { class: 'seg' },
    [['video', 'Video'], ['meme', 'Meme / Image']].map(([k, l]) =>
      el('button', { class: k === kind ? 'active' : '', text: l, onclick: (e) => {
        kind = k;
        $$('button', seg).forEach(b => b.classList.toggle('active', b === e.currentTarget));
        renderPicker();
      } }))
  );

  const stage = el('div', { style: { marginTop: '16px' } });
  body.append(seg, stage);

  const caption = el('textarea', { class: 'input', placeholder: 'Write a caption… #hashtags make you discoverable', maxlength: 500 });
  const tagInput = el('input', { class: 'input', placeholder: 'Tag people: @username, @username' });

  // Music picker: tap to open the search sheet. Chosen track is held here.
  let pickedSound = null;
  const soundBtn = el('button', { class: 'music-pick', type: 'button' },
    el('span', { class: 'music-pick-icon', html: icon('music', 20) }),
    el('span', { class: 'music-pick-text' },
      el('b', { text: 'Add music' }),
      el('small', { text: 'Search for a song, or paste a YouTube / Spotify link' })),
    el('span', { class: 'music-pick-chev', html: icon('chevron', 18) }));

  function paintSoundBtn() {
    const text = soundBtn.querySelector('.music-pick-text');
    if (!pickedSound) {
      text.innerHTML = '';
      text.append(el('b', { text: 'Add music' }),
        el('small', { text: 'Search for a song, or paste a YouTube / Spotify link' }));
      soundBtn.classList.remove('has');
      soundBtn.querySelector('.music-pick-icon').innerHTML = icon('music', 20);
      return;
    }
    text.innerHTML = '';
    text.append(el('b', { text: pickedSound.title }),
      el('small', { text: pickedSound.artist + (pickedSound.provider === 'itunes' ? ' · 30s preview' : '') }));
    soundBtn.classList.add('has');
    soundBtn.querySelector('.music-pick-icon').innerHTML = pickedSound.artwork
      ? `<img src="${pickedSound.artwork}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`
      : icon('music', 20);
  }
  paintSoundBtn();
  soundBtn.onclick = () => openMusicPicker({
    onPick: (track) => { pickedSound = track; paintSoundBtn(); },
    onClear: () => { pickedSound = null; paintSoundBtn(); }
  });
  const visibility = el('select', { class: 'input' },
    el('option', { value: 'public', text: 'Public — everyone can see' }),
    el('option', { value: 'followers', text: 'Followers only' }),
    el('option', { value: 'private', text: 'Private — only me' })
  );

  const progBar = el('div', { class: 'progress hidden' }, el('i'));
  const publishBtn = el('button', { class: 'btn btn-primary', text: 'Publish', style: { marginTop: '18px' } });

  function renderPicker() {
    stage.innerHTML = '';
    if (!file) {
      const dz = el('button', { class: 'dropzone', type: 'button' },
        el('div', { class: 'dz-icon', html: icon('upload', 30) }),
        el('b', { text: kind === 'video' ? 'Upload a video' : 'Upload an image' }),
        el('span', { text: kind === 'video'
          ? 'MP4, MOV or WebM · up to 100 MB'
          : 'JPG, PNG, GIF or WebP · up to 100 MB' })
      );
      dz.onclick = () => chooseFile();
      stage.append(dz);
      if (kind === 'video') {
        stage.append(el('button', {
          class: 'btn btn-ghost btn-block', style: { marginTop: '10px' }, type: 'button',
          html: icon('camera', 18) + ' <span>Record with camera</span>',
          onclick: () => chooseFile()
        }));
      }
      stage.append(el('div', { style: { marginTop: '16px' } },
        el('div', { class: 'field' }, el('label', { text: 'Caption' }), caption),
        el('div', { class: 'field' }, el('label', { text: 'Tag people' }), tagInput),
        el('div', { class: 'field' }, el('label', { text: 'Music' }), soundBtn),
        el('div', { class: 'field' }, el('label', { text: 'Who can see this' }), visibility),
        progBar, publishBtn
      ));
      return;
    }

    const box = el('div', { class: 'preview-box' });
    if (isVideoFile(file)) {
      box.append(el('video', { src: URL.createObjectURL(file), controls: true, playsinline: true, loop: true, style: { width: '100%', maxHeight: '46vh' } }));
    } else {
      box.append(el('img', { src: URL.createObjectURL(file), style: { width: '100%', maxHeight: '46vh', objectFit: 'contain' } }));
    }
    box.append(el('button', { class: 'rm', html: icon('close', 16), onclick: () => { file = null; renderPicker(); } }));
    stage.append(box);
    stage.append(el('div', { class: 'hint', text: `${file.name} · ${(file.size / 1048576).toFixed(1)} MB` }));
    stage.append(el('div', { style: { marginTop: '16px' } },
      el('div', { class: 'field' }, el('label', { text: 'Caption' }), caption),
      el('div', { class: 'field' }, el('label', { text: 'Tag people' }), tagInput),
      el('div', { class: 'field' }, el('label', { text: 'Music' }), soundBtn),
      el('div', { class: 'field' }, el('label', { text: 'Who can see this' }), visibility),
      progBar, publishBtn
    ));
  }
  renderPicker();

  publishBtn.onclick = async () => {
    if (!file) return toastErr('Pick a file first');
    publishBtn.disabled = true;
    publishBtn.innerHTML = '<span class="spinner"></span>';
    progBar.classList.remove('hidden');
    try {
      const mediaUrl = await posts.uploadMedia(S.user.id, file, (p) => {
        progress = p; $('i', progBar).style.width = Math.round(p * 100) + '%';
      });

      // Attach the chosen track. attach_sound() reuses an existing row for the
      // same song, so two people picking the same track share one sound and its
      // use_count actually means something.
      let soundId = null;
      if (pickedSound) {
        soundId = await sounds.attach(pickedSound);
      }

      const tagged = [];
      for (const u of extractMentions(tagInput.value)) {
        const pr = await profiles.byUsername(u);
        if (pr) tagged.push(pr.id);
      }

      const created = await posts.create({
        authorId: S.user.id,
        kind: isVideoFile(file) ? 'video' : 'meme',
        mediaUrl,
        caption: caption.value.trim(),
        soundId,
        taggedUsers: tagged,
        visibility: visibility.value
      });

      Object.keys(S.feedCache).forEach(k => delete S.feedCache[k]);
      S.profile = await profiles.get(S.user.id);
      toastOk('Posted! 🎉');
      navigate('post', { id: created.id });
    } catch (e) {
      toastErr(e.message || 'Upload failed');
    } finally {
      publishBtn.disabled = false;
      publishBtn.textContent = 'Publish';
      progBar.classList.add('hidden');
      $('i', progBar).style.width = '0';
    }
  };
}

async function mountThread(view) {
  const convId = S.params.id;
  const phone = el('div', { class: 'phone-col', style: { height: '100%', display: 'flex', flexDirection: 'column' } });
  view.append(phone);

  let other = null;
  const header = el('div', { class: 'topbar' },
    el('button', { class: 'icon-btn', html: icon('back', 22), onclick: () => navigate('messages') }),
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } }),
    el('div', { class: 'spacer' }),
    el('div', { id: 'thread-actions' })
  );
  phone.append(header);

  const msgs = el('div', { class: 'dm-msgs' });
  const input = el('input', { class: 'input', placeholder: 'Message…' });
  const send = el('button', { class: 'icon-btn', html: icon('send', 20), style: { color: 'var(--accent-3)' } });
  const foot = el('div', { class: 'sheet-foot', style: { flex: 'none' } },
    el('div', { class: 'comment-bar' }, input, send));
  phone.append(msgs, foot);

  msgs.append(skeletonList(4, 40));

  let conv = null;
  try {
    const rows = await messaging.conversations(S.user.id);
    conv = rows.find(r => r.id === convId) || null;
    other = conv?.other || null;
  } catch { /* ignore */ }

  if (other) {
    const slot = header.children[1];
    slot.append(avatarEl(other, 34), el('b', { text: other.display_name || other.username, style: { fontSize: '15px' } }));
    slot.style.cursor = 'pointer';
    slot.onclick = () => navigate('profile', { id: other.id });
    header.children[3].append(
      el('button', { class: 'icon-btn', title: 'Voice call', html: icon('mic', 20),
        onclick: () => startCall(other, 'audio') }),
      el('button', { class: 'icon-btn', title: 'Video call', html: icon('cam', 20),
        onclick: () => startCall(other, 'video') }),
      el('button', { class: 'icon-btn', html: icon('more', 22), onclick: () => openUserMenu(other) }));
  }

  const seen = new Set();
  function appendMsg(m, animate = true) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const mine = m.sender_id === S.user.id;
    const node = el('div', { class: `msg ${mine ? 'me' : 'them'}` });
    if (m.post_id) {
      const sp = m.post || null;
      const card = el('div', { class: 'msg-shared', style: { background: 'rgba(0,0,0,.25)', cursor: 'pointer' },
        onclick: () => navigate('post', { id: m.post_id }) });
      if (sp) {
        card.append(sp.kind === 'video'
          ? el('video', { src: sp.media_url, muted: true, playsinline: true, preload: 'metadata', style: { width: '100%', height: '190px', objectFit: 'cover' } })
          : el('img', { src: sp.thumb_url || sp.media_url, style: { width: '100%', height: '190px', objectFit: 'cover' } }));
        if (sp.caption) card.append(el('div', { class: 'cap', text: sp.caption.slice(0, 80) }));
      } else {
        card.append(el('div', { class: 'cap', text: 'Shared a post' }));
      }
      node.append(card);
    }
    if (m.body) node.append(el('div', { text: m.body }));
    node.append(el('div', { class: 'when', text: clockTime(m.created_at) }));
    msgs.append(node);
    if (animate) msgs.scrollTop = msgs.scrollHeight;
  }

  // Call history rides in the same stream as messages, ordered by time.
  function appendCall(c) {
    if (seen.has('call:' + c.id)) return;
    seen.add('call:' + c.id);
    msgs.append(callRow(c, other));
  }

  try {
    const [rows, pastCalls] = await Promise.all([
      messaging.messages(convId),
      callHistory.forConversation(convId).catch(() => [])
    ]);
    msgs.innerHTML = '';
    // Merge messages and calls into one chronological list.
    const timeline = [
      ...rows.map(r => ({ at: r.created_at, row: r, isCall: false })),
      ...pastCalls.map(c => ({ at: c.created_at, row: c, isCall: true }))
    ].sort((a, b) => new Date(a.at) - new Date(b.at));
    for (const item of timeline) {
      if (item.isCall) appendCall(item.row); else appendMsg(item.row, false);
    }
    msgs.scrollTop = msgs.scrollHeight;
    await messaging.markRead(convId, S.user.id);
  } catch (e) {
    msgs.innerHTML = '';
    msgs.append(emptyState({ icon: 'flag', title: 'Could not load conversation', text: diagnose(e) }));
  }

  const unsub = messaging.subscribe(convId, (m) => {
    if (m.sender_id === S.user.id) return;
    appendMsg(m);
    messaging.markRead(convId, S.user.id);
  });
  routeCleanup = () => unsub();

  const doSend = async () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const optimistic = {
      id: 'tmp-' + Date.now(), conversation_id: convId, sender_id: S.user.id,
      body: text, created_at: new Date().toISOString()
    };
    appendMsg(optimistic);
    try {
      const real = await messaging.send({ conversationId: convId, senderId: S.user.id, body: text });
      seen.delete(optimistic.id);
      seen.add(real.id);
    } catch (e) {
      toastErr(e.message || 'Message failed');
    }
  };
  send.onclick = doSend;
  input.addEventListener('keydown', e => e.key === 'Enter' && doSend());
}

      toastErr(e.message);
    }
  };

  body.append(el('div', { class: 'section-head', style: { padding: '22px 16px 8px' } }, el('h3', { text: 'Safety' })));
  body.append(row('block', 'Blocked accounts', `${S.blocked.size} blocked`, () => openBlocked()));
  body.append(row('flag', 'My reports', 'Review what you have reported', () => openMyReports()));
  body.append(row('lock', 'Privacy & moderation', 'How Zonk handles reports', () => {
    openSheet({
      title: 'Privacy & moderation',
      body: el('div', { style: { padding: '4px 18px 10px', color: 'var(--text-2)', fontSize: '14px', lineHeight: '1.6' } },
        el('p', { text: 'Zonk uses a report-and-review model. When you report a post, comment or account, it is queued for moderation and hidden from your feed immediately where possible.' }),
        el('p', { text: 'Blocking an account hides their content from you, prevents them from following you, and severs any existing follow relationship in both directions.' }),
        el('p', { text: 'You can delete any of your own posts or comments at any time from the post menu or comment menu. Deleting is permanent.' }),
        el('p', { text: 'Your email is only ever visible to you. Your posts follow the visibility you choose: public, followers-only, or private.' })
      )
    });
  }));

  body.append(el('div', { style: { padding: '24px 16px' } },
    el('button', { class: 'btn btn-danger btn-block', html: icon('logout', 18) + ' <span>Log out</span>', onclick: async () => {
      const keep = auth.getRemember();
      const ok = await confirmDialog({
        title: 'Log out of Zonk?',
        message: keep
          ? `You'll be signed out, but we'll remember ${auth.lastEmail() || 'your email'} so logging back in is one step.`
          : 'You can log back in any time.',
        confirmLabel: 'Log out', danger: true
      });
      if (!ok) return;
      if (!keep) auth.forgetDevice();
      await auth.signOut();
      resetState();
      renderAuth();
    } })));

  body.append(el('div', { style: { textAlign: 'center', color: 'var(--text-3)', fontSize: '12px', paddingBottom: '20px' } },
    'Zonk · v1.0 · built on Supabase'));

  function row(ic, title, sub, onclick) {
    return el('div', { class: 'settings-row', style: { cursor: 'pointer' }, onclick },
      iconEl(ic, 21, 'lead'),
      el('div', { class: 'meta' }, el('b', { text: title }), el('span', { text: sub })),
      iconEl('chevron', 18, 'lead'));
  }
}

async function openBlocked() {
  const body = el('div');
  body.append(skeletonList(3, 60));
  openSheet({ title: 'Blocked accounts', body });
  try {
    const rows = await safety.blocked(S.user.id);
    body.innerHTML = '';
    if (!rows.length) { body.append(emptyState({ icon: 'block', title: 'Nobody is blocked', text: 'Accounts you block appear here.' })); return; }
    rows.forEach(r => {

      if (!u) return;
      body.append(el('div', { class: 'user-row' },
        avatarEl(u, 44),
        el('div', { class: 'meta' }, el('b', { text: u.display_name || u.username }), el('span', { text: '@' + u.username })),
        el('button', { class: 'btn btn-ghost btn-sm', text: 'Unblock', onclick: async (e) => {
          e.stopPropagation();
          try {
            await safety.unblock(S.user.id, u.id);

          } catch (err) { toastErr(err.message); }

    body.innerHTML = '';
    body.append(emptyState({ icon: 'flag', title: 'Could not load blocked list', text: diagnose(e) }));

}

async function openMyReports() {

/* ============================================================= MUSIC */

/**
 * Sheet for choosing a track: live search, or paste a YouTube/Spotify link.
 * onPick(track) receives a normalised track object.
 */
function openMusicPicker({ onPick, onClear } = {}) {
  const input = el('input', { class: 'input', placeholder: 'Search songs…' });
  const results = el('div', { class: 'music-results' });
  const msg = el('div', { class: 'hint', style: { margin: '4px 0 0' } });

  let debounceTimer = null;
  let lastQuery = '';

  const sheet = openSheet({
    title: 'Add music',
    body: el('div', {},
      input,
      msg,
      results)
  });

  function paint(rows) {
    results.innerHTML = '';
    if (!rows.length) {
      results.append(el('div', { class: 'hint', style: { padding: '18px 4px' },
        text: 'No tracks found. Try different words, or paste a link.' }));
      return;
    }
    for (const t of rows) {
      const row = el('button', { class: 'music-row', type: 'button' },
        el('span', { class: 'music-art' },
          t.artwork ? el('img', { src: t.artwork, alt: '', loading: 'lazy' }) : iconEl('music', 20)),
        el('span', { class: 'music-meta' },
          el('b', { text: t.title }),
          el('small', { text: t.artist })),
        el('span', { class: 'music-preview', html: icon('play', 18) }));

      // Preview plays inline without closing the sheet, so you can audition tracks.
      row.querySelector('.music-preview').onclick = (e) => { e.stopPropagation(); music.toggle(t); };
      row.onclick = () => {
        onPick?.(t);
        toastOk(`Added “${t.title}”`);
        closeAll();
      };
      results.append(row);
    }
  }

  async function runSearch(q) {
    lastQuery = q;
    msg.textContent = 'Searching…';
    try {
      const rows = await music.searchSongs(q);
      if (lastQuery !== q) return;   // a newer search already started
      msg.textContent = '';
      paint(rows);
    } catch (e) {
      msg.textContent = '';
      results.innerHTML = '';
      results.append(el('div', { class: 'hint', style: { padding: '18px 4px' }, text: e.message }));
    }
  }

  async function tryLink(text) {
    const link = music.parseMusicLink(text);
    if (!link) return false;
    msg.textContent = 'Reading link…';
    try {
      const track = await music.lookupLink(link);
      msg.textContent = '';
      paint([track]);
    } catch (e) {
      msg.textContent = e.message;
    }
    return true;
  }

  input.oninput = () => {
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    if (!q) { results.innerHTML = ''; msg.textContent = ''; return; }
    debounceTimer = setTimeout(async () => {
      // A pasted link is resolved directly; anything else is a search.
      if (await tryLink(q)) return;
      if (q.length >= 2) runSearch(q);
    }, 380);
  };

  input.onkeydown = (e) => {
    if (e.key === 'Enter') { clearTimeout(debounceTimer); tryLink(input.value.trim()).then(ok => { if (!ok) runSearch(input.value.trim()); }); }
  };

  if (onClear) {
    sheet.modal?.append(el('div', { style: { marginTop: '14px' } },
      el('button', { class: 'btn btn-ghost btn-block', text: 'Remove music',
        onclick: () => { onClear(); closeAll(); } })));
  }

  setTimeout(() => input.focus(), 120);
}

/** Persistent bar showing what is playing, with a pause button. */
function mountNowPlaying() {
  let bar = $('#now-playing');
  if (!bar) {
    bar = el('div', { id: 'now-playing' });
    document.body.append(bar);
  }
  const paint = (np) => {
    if (!np) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
    bar.classList.add('show');
    bar.innerHTML = '';
    bar.append(
      el('div', { class: 'np-art' },
        np.artwork ? el('img', { src: np.artwork, alt: '' }) : iconEl('music', 18)),
      el('div', { class: 'np-meta' },
        el('b', { text: np.title }),
        el('small', { text: np.artist })),
      el('button', { class: 'icon-btn', title: np.playing ? 'Pause' : 'Play',
        html: icon(np.playing ? 'pause' : 'play', 20),
        onclick: () => music.toggle(np) }),
      el('button', { class: 'icon-btn', title: 'Stop', html: icon('close', 20),
        onclick: () => music.stop() }));
  };
  music.onMusicChange(paint);
  paint(music.nowPlaying());
}

/**
 * Turn a post's stored `sound` row into a playable track object.
 * Rows written before this feature existed have no provider — they fall back to
 * a label with no playback rather than erroring.
 */
function trackFromSound(snd) {
  if (!snd) return null;
  const provider = snd.provider || 'original';
  if (provider === 'original' || (!snd.external_id && !snd.preview_url && !snd.audio_url)) return null;
  return {
    provider,
    externalId: snd.external_id || snd.id,
    title: snd.title || 'Unknown track',
    artist: snd.artist || 'unknown artist',
    artwork: snd.artwork_url || snd.cover_url || null,
    preview: snd.preview_url || snd.audio_url || null,
    permalink: snd.permalink || null
  };
}

/* ============================================================= CALLS */
let callUnsub = null;
let callRenderSig = null;   // shape of the overlay currently built
let callTickIv = null;      // running call-duration interval

function startCalls(userId) {
  stopCalls();
  onCallNotice(text => toast(text));
  callUnsub = calls.onCallChange(renderCallOverlay);
  calls.init(userId).catch(e => console.warn('[zonk] calls unavailable:', e?.message || e));
}

function stopCalls() {
  try { music.stop(); } catch {}
  try { callUnsub?.(); } catch {}
  callUnsub = null;
  try { calls.teardown(); } catch {}
  clearInterval(callTickIv); callTickIv = null;
  callRenderSig = null;
  const root = $('#call-root');
  if (root) { root.classList.remove('show'); root.innerHTML = ''; }
}

/**
 * Place a call with someone. Ensures a conversation exists first, because the
 * call record is tied to one (and so the history shows up in that thread).
 */
async function startCall(other, kind = 'video') {
  if (!other?.id) return;
  if (other.id === S.user.id) return toastErr('You can’t call yourself.');
  if (calls.isBusy()) return toastErr('You’re already on a call.');
  try {
    const convId = await messaging.getOrCreateDM(other.id);
    await calls.start({ conversationId: convId, peer: other, kind });
  } catch (e) {
    if (/Permission|NotAllowed|denied/i.test(e?.name + ' ' + (e?.message || ''))) {
      toastErr('Camera/microphone permission was blocked. Allow it in your browser, then try again.');
    } else {
      toastErr(e?.message || 'Could not start the call');
    }
  }
}

/** Fullscreen overlay driven entirely by calls.currentCall().
 *
 *  This used to rebuild the whole overlay on every emit. That tears down the
 *  <video> elements mid-call — the picture goes black and the timer restarts —
 *  because incoming tracks, mute and connection changes all fire emit(). Now
 *  the DOM is rebuilt only when the SHAPE of the call changes (phase, kind,
 *  peer); streams and button state are refreshed in place instead. */
function renderCallOverlay() {
  let root = $('#call-root');
  if (!root) { root = el('div', { id: 'call-root' }); document.body.append(root); }

  const c = calls.currentCall();
  if (!c) {
    root.classList.remove('show'); root.innerHTML = '';
    clearInterval(callTickIv); callTickIv = null;
    callRenderSig = null;
    return;
  }

  const sig = `${c.phase}|${c.kind}|${c.role}|${c.peerId}`;
  if (sig === callRenderSig) { refreshCallLive(root, c); return; }
  callRenderSig = sig;

  root.classList.add('show');
  root.innerHTML = '';
  clearInterval(callTickIv); callTickIv = null;

  const incoming = c.phase === 'ringing' && c.role === 'callee';
  const waiting = c.phase === 'ringing' || c.phase === 'inviting';

  const avatar = el('div', { class: 'call-avatar' },
    el('span', { text: (c.peerName || '?').trim().charAt(0).toUpperCase() }));
  const status = el('div', { class: 'call-status', text:
    incoming ? `Incoming ${c.kind} call`
    : c.phase === 'active' ? 'Connected'
    : c.phase === 'connecting' ? 'Connecting…'
    : c.kind === 'video' ? 'Video calling…' : 'Calling…' });

  if (c.phase === 'active') {
    const stage = el('div', { class: 'call-stage' });
    const remote = el('video', { class: 'call-remote', autoplay: true, playsinline: true });
    const local = el('video', { class: 'call-local', autoplay: true, playsinline: true, muted: true });
    stage.append(remote, local);

    const tick = el('div', { class: 'call-timer' });
    const paint = () => { if (tick.isConnected) tick.textContent = callClock(c.startedAt); };
    paint();
    callTickIv = setInterval(paint, 1000);

    const ctrls = el('div', { class: 'call-controls' },
      el('button', { class: `call-btn mute ${c.muted ? 'off' : ''}`, title: c.muted ? 'Unmute' : 'Mute',
        html: icon(c.muted ? 'micoff' : 'mic', 24), onclick: () => calls.toggleMute() }),
      c.kind === 'video' && el('button', { class: `call-btn cam ${c.camOff ? 'off' : ''}`, title: c.camOff ? 'Camera on' : 'Camera off',
        html: icon(c.camOff ? 'camoff' : 'cam', 24), onclick: () => calls.toggleCam() }),
      el('button', { class: 'call-btn end', title: 'Hang up', html: icon('hangup', 26), onclick: () => calls.hangup() }));

    root.append(stage, el('div', { class: 'call-top' }, el('b', { text: c.peerName }), tick), ctrls);
    requestAnimationFrame(() => {
      attachStream(remote, c.remoteStream, false);
      attachStream(local, c.localStream, true);
    });
    return;
  }

  const ctrls = incoming
    ? el('div', { class: 'call-controls' },
        el('button', { class: 'call-btn end', title: 'Decline', html: icon('hangup', 26), onclick: () => calls.decline() }),
        el('button', { class: 'call-btn accept', title: 'Accept', html: icon(c.kind === 'video' ? 'cam' : 'mic', 26), onclick: () => calls.accept() }))
    : el('div', { class: 'call-controls' },
        el('button', { class: 'call-btn end', title: 'Cancel', html: icon('hangup', 26), onclick: () => calls.hangup() }));

  root.append(el('div', { class: 'call-incoming' }, avatar,
    el('b', { class: 'call-name', text: c.peerName }), status), ctrls);
}

/** Refresh an already-built overlay in place — streams, timer, and the
 *  mute/camera button state — without replacing its DOM. */
function refreshCallLive(root, c) {
  attachStream(root.querySelector('.call-remote'), c.remoteStream, false);
  attachStream(root.querySelector('.call-local'), c.localStream, true);

  const tick = root.querySelector('.call-timer');
  if (tick && c.startedAt) tick.textContent = callClock(c.startedAt);

  const mute = root.querySelector('.call-btn.mute');
  if (mute) { mute.classList.toggle('off', !!c.muted); mute.innerHTML = icon(c.muted ? 'micoff' : 'mic', 24); }
  const cam = root.querySelector('.call-btn.cam');
  if (cam) { cam.classList.toggle('off', !!c.camOff); cam.innerHTML = icon(c.camOff ? 'camoff' : 'cam', 24); }
}

function attachStream(videoEl, stream, muted) {
  if (!videoEl) return;
  if (videoEl.srcObject !== stream) videoEl.srcObject = stream || null;
  videoEl.muted = !!muted;
  if (stream) videoEl.play?.().catch(() => {});
}

function callClock(startedAt) {
  if (!startedAt) return '';
  const s = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
  const m = Math.floor(s / 60);
  return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

/** One row in a DM thread describing a past call. */
function callRow(c, other) {
  const outgoing = c.caller_id === S.user.id;
  const missed = c.status === 'missed' || c.status === 'declined';
  const label = c.status === 'active' || c.status === 'ended'
    ? (c.duration_seconds ? `Call · ${callClock(Date.now() - c.duration_seconds * 1000)}` : 'Call ended')
    : missed ? (outgoing ? 'No answer' : 'Missed call')
    : c.status === 'cancelled' ? 'Cancelled' : 'Call';
  const row = el('div', { class: `call-row ${missed ? 'missed' : ''}` },
    iconEl(c.kind === 'video' ? 'cam' : 'mic', 18, 'lead'),
    el('div', { class: 'meta' },
      el('b', { text: `${outgoing ? 'Outgoing' : 'Incoming'} ${c.kind} call` }),
      el('span', { text: `${label} · ${timeAgo(c.created_at)}` })),
    other && el('button', { class: 'icon-btn', html: icon(c.kind === 'video' ? 'cam' : 'mic', 18),
      title: 'Call back', onclick: () => startCall(other, c.kind) }));
  return row;
}

/* ============================================================ REPORT */
const REPORT_REASONS = [
  'Harassment or bullying', 'Hate speech', 'Violence or dangerous content',
  'Sexual content', 'Spam or scam', 'Misinformation', 'I just don’t like it', 'Something else'
];

function openReport({ targetType, targetId, label }) {
  let reason = null;
  const details = el('textarea', { class: 'input', placeholder: 'Add any detail that helps moderators (optional)', maxlength: 500 });
  const reasons = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
    REPORT_REASONS.map(r => el('button', {
      class: 'chip', style: { justifyContent: 'flex-start', width: '100%', textAlign: 'left' },
      text: r,
      onclick: (e) => {
        reason = r;
        $$('button', reasons).forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
      }
    })));

  const submit = el('button', { class: 'btn btn-primary', text: 'Submit report' });
  const { modal } = openModal({
    title: `Report ${label}`,
    body: el('div', {},
      el('p', { style: { color: 'var(--text-2)', marginTop: '0', fontSize: '14px' }, text: 'Why are you reporting this?' }),
      reasons,
      el('div', { class: 'field', style: { marginTop: '16px' } }, el('label', { text: 'Details' }), details))
  });
  modal.append(el('div', { style: { marginTop: '18px' } }, submit));

  submit.onclick = async () => {
    if (!reason) return toastErr('Pick a reason first');
    submit.disabled = true; submit.innerHTML = '<span class="spinner"></span>';
    try {
      await safety.report({ reporterId: S.user.id, targetType, targetId, reason, details: details.value.trim() });
      closeAll();
      toastOk('Report submitted — thanks for keeping Zonk safe');
    } catch (e) {
      toastErr(e.message || 'Could not submit report');
    } finally {
      submit.disabled = false; submit.textContent = 'Submit report';
    }
  };
}

/* post menu is reachable from the post viewer via long-press / more */
document.addEventListener('contextmenu', (e) => {
  const slide = e.target.closest('.slide');
  if (!slide) return;
  e.preventDefault();
  const id = slide.dataset.id;
  if (id) openPostMenu(id);
});

async function openPostMenu(postId) {
  let post = Object.values(S.feedCache).flat().find(p => p.id === postId);
  if (!post) { try { post = await posts.get(postId); } catch { /* ignore */ } }
  const mine = post?.author_id === S.user.id;
  const body = el('div', { class: 'menu' },
    menuBtn('flag', 'Report post', () => { closeAll(); openReport({ targetType: 'post', targetId: postId, label: 'post' }); }),
    post && !mine ? menuBtn('block', 'Block @' + (post.author?.username || ''), async () => {
      closeAll();
      if (!await confirmDialog({ title: 'Block this account?', message: 'Their content disappears from your feed.', confirmLabel: 'Block', danger: true })) return;
      try {
        await safety.block(S.user.id, post.author_id);
        S.blocked.add(post.author_id);
        S.feedCache = {};
        toastOk('Blocked');
        renderShell();
      } catch (e) { toastErr(e.message); }
    }, true) : null,
    mine ? menuBtn('trash', 'Delete post', async () => {
      closeAll();
      if (!await confirmDialog({ title: 'Delete this post?', message: 'This cannot be undone.', confirmLabel: 'Delete', danger: true })) return;
      try {
        await posts.remove(postId);
        Object.keys(S.feedCache).forEach(k => delete S.feedCache[k]);
        S.profile = await profiles.get(S.user.id);
        toastOk('Post deleted');
        navigate('feed');
      } catch (e) { toastErr(e.message); }
    }, true) : null,
    mine ? menuBtn('lock', 'Change visibility', () => {
      closeAll();
      openVisibilityPicker(post);
    }) : null
  );
  openSheet({ title: 'Post options', body });
}

function openVisibilityPicker(post) {
  const opts = [['public', 'Public'], ['followers', 'Followers only'], ['private', 'Private']];
  const body = el('div', { class: 'menu' }, opts.map(([v, l]) =>
    menuBtn('lock', l, async () => {
      try {
        await posts.setVisibility(post.id, v);
        post.visibility = v;
        Object.keys(S.feedCache).forEach(k => delete S.feedCache[k]);
        closeAll();
        toastOk('Visibility updated');
      } catch (e) { toastErr(e.message); }
    })));
  openSheet({ title: 'Who can see this post', body });
}

/* expose a tiny hook for the post viewer's more button */
window.ZONK_OPEN_POST_MENU = openPostMenu;
