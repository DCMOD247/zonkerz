var ZONK_MUSIC = (function () {
/* ==========================================================================
   ZONK · music
   Real music: search, attach to a post, and play it back.

   DISCOVERY — iTunes Search API
     No API key, no OAuth, no signup, and it sends Access-Control-Allow-Origin:
     so the browser can call it directly. Returns real artwork and a 30-second
     preview MP3 per track.

   PLAYBACK — two engines
     • iTunes preview  -> a plain <audio> element playing the preview URL.
     • YouTube / Spotify link -> embedded players, for the full track.
     A pasted YouTube link needs no API key; the IFrame player just takes a
     video id. Spotify embeds are a self-contained widget (its iframe is
     cross-origin, so we cannot drive play/pause from here — that is a Spotify
     restriction, not an oversight).

   WHY NOT SPOTIFY'S WEB API
     Full-track playback through it requires every listener to have Spotify
     Premium and the app to hold an OAuth client secret. Not worth it for a
     feature whose whole point is that it works with no setup.
   ========================================================================== */

const ITUNES = 'https://itunes.apple.com/search';
const YT_API = 'https://www.youtube.com/iframe_api';

/* ---------------------------------------------------------------- search */

/** Normalise one iTunes result into the shape the rest of the app uses. */
function fromItunes(t) {
  return {
    provider: 'itunes',
    externalId: String(t.trackId),
    title: t.trackName || 'Unknown track',
    artist: t.artistName || 'Unknown artist',
    album: t.collectionName || '',
    // Ask for a bigger cover than the API's default 100px.
    artwork: (t.artworkUrl100 || '').replace(/100x100bb/, '300x300bb'),
    preview: t.previewUrl || null,
    permalink: t.trackViewUrl || null,
    duration: t.trackTimeMillis ? Math.round(t.trackTimeMillis / 1000) : null
  };
}

async function searchSongs(query, limit = 24) {
  const q = (query || '').trim();
  if (!q) return [];
  const url = `${ITUNES}?term=${encodeURIComponent(q)}&entity=song&limit=${limit}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Music search is unavailable right now.');
  const data = await res.json();
  // iTunes happily returns podcasts/audiobooks in the song entity; drop anything
  // without a preview so every result is actually playable.
  return (data.results || [])
    .filter(r => r.previewUrl && r.kind === 'song')
    .map(fromItunes);
}

/* ------------------------------------------------------------ link input */

/**
 * Recognise a pasted YouTube / Spotify / Apple Music link.
 * Returns { provider, externalId, embedUrl } or null.
 */
function parseMusicLink(input) {
  const raw = (input || '').trim();
  if (!raw) return null;
  let u;
  try { u = new URL(raw.startsWith('http') ? raw : 'https://' + raw); } catch { return null; }
  const host = u.hostname.replace(/^www\./, '');
  const path = u.pathname;

  if (host === 'youtu.be') {
    const id = path.slice(1).split('/')[0];
    if (id) return yt(id);
  }
  if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
    const v = u.searchParams.get('v');
    if (v) return yt(v);
    const m = path.match(/^\/(embed|shorts|live|v)\/([A-Za-z0-9_-]{6,})/);
    if (m) return yt(m[2]);
  }
  if (host.endsWith('spotify.com')) {
    const m = path.match(/^\/(track|album|playlist|episode|artist)\/([A-Za-z0-9]+)/);
    if (m) return {
      provider: 'spotify',
      externalId: m[2],
      kind: m[1],
      embedUrl: `https://open.spotify.com/embed/${m[1]}/${m[2]}`
    };
  }
  if (host.endsWith('music.apple.com')) {
    const m = path.match(/\/album\/[^/]+\/(\d+)/);
    if (m) return { provider: 'itunes', externalId: m[1], embedUrl: raw };
  }
  return null;

  function yt(id) {
    return { provider: 'youtube', externalId: id, embedUrl: `https://www.youtube.com/embed/${id}` };
  }
}

/** Fill in title/artist/artwork for a pasted link via public oEmbed. */
async function lookupLink(link) {
  if (link.provider === 'youtube') {
    const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + link.externalId)}&format=json`);
    if (!r.ok) throw new Error('That YouTube link could not be read.');
    const d = await r.json();
    return {
      provider: 'youtube', externalId: link.externalId,
      title: d.title || 'YouTube video',
      artist: d.author_name || 'YouTube',
      artwork: d.thumbnail_url || null,
      preview: null, permalink: `https://www.youtube.com/watch?v=${link.externalId}`,
      embedUrl: link.embedUrl
    };
  }
  if (link.provider === 'spotify') {
    const r = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(`https://open.spotify.com/${link.kind}/${link.externalId}`)}`);
    if (!r.ok) throw new Error('That Spotify link could not be read.');
    const d = await r.json();
    return {
      provider: 'spotify', externalId: link.externalId,
      title: d.title || 'Spotify track',
      artist: d.author_name || 'Spotify',
      artwork: d.thumbnail_url || null,
      preview: null, permalink: `https://open.spotify.com/${link.kind}/${link.externalId}`,
      embedUrl: link.embedUrl
    };
  }
  throw new Error('Paste a YouTube or Spotify link.');
}

/* ---------------------------------------------------------------- player */

let ytApiPromise = null;
let ytPlayer = null;
let ytHost = null;
let ytQueue = null;

/** Load the YouTube IFrame API once, resolving when it is usable. */
function loadYouTubeApi() {
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    if (window.YT?.Player) return resolve(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { prev?.(); } catch {} resolve(window.YT); };
    const s = document.createElement('script');
    s.src = YT_API;
    s.async = true;
    s.onerror = () => reject(new Error('Could not load the YouTube player.'));
    document.head.append(s);
    setTimeout(() => reject(new Error('YouTube player timed out.')), 12000);
  });
  return ytApiPromise;
}

function ensureYtHost() {
  if (!ytHost) {
    ytHost = document.createElement('div');
    ytHost.id = 'zonk-yt-host';
    ytHost.setAttribute('aria-hidden', 'true');
    document.body.append(ytHost);
  }
  return ytHost;
}

/* ---- state + subscribers ---- */
let current = null;      // the track object
let audio = null;        // HTMLAudioElement for previews
let playing = false;
let listeners = new Set();

const nowPlaying = () => (current ? { ...current, playing } : null);
function onMusicChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
const emit = () => { for (const fn of listeners) { try { fn(nowPlaying()); } catch (e) { console.error(e); } } };

function stopYt() {
  try { ytPlayer?.stopVideo?.(); } catch {}
}

function stopAudio() {
  if (!audio) return;
  try { audio.pause(); audio.currentTime = 0; } catch {}
  audio = null;
}

/** Stop whatever is playing, without clearing the "current track" label. */
function pause() {
  playing = false;
  if (current?.provider === 'youtube') {
    try { ytPlayer?.pauseVideo?.(); } catch {}
  } else {
    try { audio?.pause(); } catch {}
  }
  emit();
}

function stop() {
  playing = false;
  stopAudio();
  stopYt();
  current = null;
  emit();
}

/**
 * Play a track. Returns a promise that settles once playback has been asked for
 * (not when it finishes).
 */
async function play(track) {
  if (!track) return;
  // Tapping the same track again toggles it.
  if (current?.provider === track.provider && current?.externalId === track.externalId && playing) {
    pause();
    return;
  }

  stopAudio();
  stopYt();
  current = track;

  if (track.provider === 'youtube') {
    const YT = await loadYouTubeApi();
    ensureYtHost();
    if (ytPlayer && ytQueue === track.externalId) {
      ytPlayer.playVideo();
    } else {
      ytQueue = track.externalId;
      await new Promise((resolve) => {
        ytPlayer = new YT.Player('zonk-yt-host', {
          videoId: track.externalId,
          playerVars: { autoplay: 1, controls: 0, playsinline: 1, rel: 0 },
          events: {
            onReady: (e) => { e.target.playVideo(); resolve(); },
            onStateChange: (e) => {
              // 0 = ended, 1 = playing, 2 = paused
              if (e.data === 0) { playing = false; current = null; emit(); }
              else if (e.data === 1) { playing = true; emit(); }
              else if (e.data === 2) { playing = false; emit(); }
            },
            onError: () => { playing = false; emit(); }
          }
        });
        setTimeout(resolve, 8000);
      });
    }
    playing = true;
    emit();
    return;
  }

  // iTunes preview, or anything with a direct audio URL.
  const src = track.preview || track.audio_url;
  if (!src) {
    // Spotify and similar cannot be driven from here — hand off to the embed.
    playing = false;
    emit();
    return;
  }
  audio = new Audio(src);
  audio.preload = 'auto';
  audio.crossOrigin = 'anonymous';
  audio.onended = () => { playing = false; emit(); };
  audio.onerror = () => { playing = false; emit(); };
  await audio.play().catch(() => { playing = false; emit(); });
  playing = true;
  emit();
}

function toggle(track) {
  const same = current && track &&
    current.provider === track.provider && current.externalId === track.externalId;
  if (same && playing) pause();
  else play(track);
}

/** Read the current playhead, 0..1, for a progress bar. */
function progress() {
  if (!playing || !current) return 0;
  if (current.provider === 'youtube') {
    try {
      const d = ytPlayer?.getDuration?.() || 0;
      return d ? (ytPlayer.getCurrentTime() || 0) / d : 0;
    } catch { return 0; }
  }
  if (audio?.duration) return (audio.currentTime || 0) / audio.duration;
  return 0;
}


return { searchSongs, parseMusicLink, lookupLink, nowPlaying, onMusicChange, pause, stop, play, toggle, progress };
})();

const { auth, profiles, posts, reactions, comments, follows, notifications, messaging, hashtags, safety, sounds } = api;

let routeCleanup = null;

const S = {
  user: null,
  profile: null,
  route: 'feed',
  params: {},
  feedCategory: 'for_you',
  likes: new Set(),
  saves: new Set(),
  following: new Set(),
  blocked: new Set(),
  unread: 0,
  unreadDms: 0,

  ['trending', 'Trending'],
  ['following', 'Following'],
  ['new', 'New']
];

/* ============================================================== BOOT */
start();

async function start() {
  if (!isConfigured()) return renderConfigMissing();

  // A failed email link lands here as #error=… — handle it before supabase-js
  // tries to consume the hash, otherwise it throws and looks like an outage.
  const linkErr = authUrlError();
  if (linkErr) {
    clearUrlAuthError();
    return renderLinkError(linkErr);
  }

  try {
    const session = await auth.session();
    if (session?.user) await enterApp(session.user);
    else renderAuth();
  } catch (e) {
    console.error(e);

    // Last-resort safety net. If a LockManager SecurityError still escapes the
    // lock wrapper (an engine we haven't accounted for), retry once — by now the
    // probe or the failed attempt has disabled locking, so it cannot recur.
    if (/LockManager|Locks API is denied/i.test(e?.message || '')) {
      try {
        const session = await auth.session();
        if (session?.user) return await enterApp(session.user);
        return renderAuth();
      } catch (e2) {
        console.error(e2);
        return renderBootError(e2);
      }
    }

    // Distinguish a genuine outage from a stale/expired session.
    const s = await auth.session().catch(() => null);
    if (s?.user) renderBootError(e);
    else renderAuth(`Could not sign in: ${e?.message || 'unknown error'}`);
  }

  auth.onChange(async (session) => {
    if (session?.user && !S.user) await enterApp(session.user).catch(err => {
      console.error(err);
      renderBootError(err);
    });
    if (!session && S.user) { resetState(); renderAuth(); }
  });

  window.addEventListener('popstate', (e) => {
    const st = e.state || { route: 'feed', params: {} };
    S.route = st.route; S.params = st.params || {};
    renderShell();
  });

  // Fallback for the pushState path above (and for hand-edited URLs).
  window.addEventListener('hashchange', () => {
    // An auth error hash can arrive after boot too (back/forward into a failed
    // email link) — never let it be parsed as a route.
    const lateErr = authUrlError();
    if (lateErr) {
      clearUrlAuthError();
      renderLinkError(lateErr);
      return;
    }
    const raw = (location.hash || '').replace(/^#/, '');
    if (!raw || raw === S.route) return;
    const [route, slug] = raw.split('/');
    if (!route) return;
    const params = {};
    if (slug) {
      if (route === 'profile') {
        // usernames are alphanumeric; ids are uuids
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(slug)) params.id = slug;
        else params.username = slug;
      } else {
        params.id = slug;
      }
    }
    S.route = route;
    S.params = params;
    renderShell();
  });
}

function resetState() {
  stopCalls();
  Object.assign(S, {
    user: null, profile: null, route: 'feed', params: {},
    likes: new Set(), saves: new Set(), following: new Set(), blocked: new Set(),

 * `onAuthStateChange` emits INITIAL_SESSION at the same moment `getSession()`

/**

function checkbox(label, initial = false, hint = '') {
  let on = !!initial;
  const box = el('span', { class: `checkbox ${on ? 'on' : ''}` },
    el('span', { class: 'checkbox-tick', html: icon('check', 13) }));
  const node = el('label', { class: 'checkbox-row' },
    box,
    el('span', { class: 'checkbox-text' },
      el('span', { text: label }),
      hint && el('small', { text: hint })));

  const toggle = () => { on = !on; box.classList.toggle('on', on); };

  node.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } };

    case 'otp_expired':
      return 'That link has already been used, or it expired. Confirmation links are single-use and time-limited.';
    case 'access_denied':
      return 'That link is no longer valid. It may have already been used.';
    default:
      return e.description || 'That link could not be used.';
  }
}

function renderLinkError(e) {
  $('#app-root').classList.add('hidden');
  const root = $('#auth-root');
  root.classList.remove('hidden');
  root.innerHTML = '';

  const email = el('input', { class: 'input', type: 'email', placeholder: 'you@example.com', autocomplete: 'email' });
  const msg = el('div', { class: 'hidden' });
  const resend = el('button', { class: 'btn btn-primary', text: 'Send a new confirmation link' });

  resend.onclick = async () => {
    if (!email.value.trim()) { msg.className = 'alert alert-error'; msg.textContent = 'Enter your email first.'; return; }
    resend.disabled = true; resend.innerHTML = '<span class="spinner"></span>';
    try {
      await auth.resendConfirmation(email.value.trim());
      msg.className = 'alert alert-ok';
      msg.textContent = 'New link sent. Check your inbox (and your spam folder).';
    } catch (err) {
      msg.className = 'alert alert-error';
      msg.textContent = friendlyAuthError(err);
    } finally {
      resend.disabled = false; resend.textContent = 'Send a new confirmation link';
    }
  };

  root.append(el('div', { class: 'auth-card' },
    authBrand(),
    el('h2', { class: 'auth-title', text: 'This link didn’t work' }),
    el('p', { class: 'auth-sub', text: linkErrorMessage(e) }),
    msg,
    el('div', { class: 'field' }, el('label', { text: 'Your email' }), email),
    resend,
    el('div', { class: 'auth-switch' },
      el('button', { text: 'Back to log in', onclick: () => renderAuth() }))
  ));
}

/**
 * Turn a raw Postgres/PostgREST error into the specific thing to go and fix.
 * These three failures look alike in a UI but have completely different causes.
 */
function diagnose(err) {
  const m = `${err?.message || ''} ${err?.details || ''} ${err?.hint || ''}`;
  const code = err?.code || '';

  // 42501 — tables exist, but anon/authenticated were never GRANTed access.
  if (code === '42501' || /permission denied for table/i.test(m)) {
    return 'The tables exist but the anon/authenticated roles were never granted ' +
      'access to them (Postgres error 42501). This is a missing GRANT, not a ' +
      'missing schema. Open Supabase → SQL Editor and run fix-permissions.sql.';
  }

  // PGRST205 — the schema really was never applied.
  if (code === 'PGRST205' || /could not find the table|schema cache/i.test(m)) {
    return 'The tables do not exist yet. Open Supabase → SQL Editor and run supabase-schema.sql.';
  }

  // 42P17 — a policy queries its own table, so Postgres loops forever.
  if (code === '42P17' || /infinite recursion detected in policy/i.test(m)) {
    return 'A row-level security policy is querying its own table, which loops ' +
      'forever (Postgres error 42P17). This breaks the whole DM feature. ' +
      'Open Supabase → SQL Editor and run fix-messaging.sql.';
  }

  if (/LockManager|Locks API is denied/i.test(m)) {
    return 'This page is inside a sandboxed frame, where the browser blocks the Web ' +
      'Locks API that Supabase uses for sessions. Open Zonk in its own browser tab ' +
      '(see README → Running it) rather than in an embedded preview.';
  }

  if (code === 'PGRST301' || /jwt|token is expired/i.test(m)) {
    return 'Your session expired. Log out and sign in again.';
  }

  return 'Check that supabase-schema.sql has been run in your Supabase SQL editor ' +
    '(and fix-permissions.sql if you see “permission denied”).';
}

function renderBootError(err) {
  // A late failure must never tear down an app that is already running.
  if (S.profile) { toastErr(err?.message || 'Connection problem'); return; }
  $('#app-root').classList.add('hidden');
  const root = $('#auth-root');
  root.classList.remove('hidden');
  root.innerHTML = '';
  root.append(el('div', { class: 'auth-card' },
    authBrand(),
    el('h2', { class: 'auth-title', text: 'Can’t load Zonk' }),
    el('p', { class: 'auth-sub', text: 'You’re signed in, but the backend did not answer.' }),
    el('div', { class: 'alert alert-error', text: err?.message || 'Unknown error' }),
    el('div', { class: 'hint', style: { marginBottom: '18px' }, text: diagnose(err) }),
    el('button', { class: 'btn btn-primary', text: 'Retry', onclick: () => location.reload() }),
    el('div', { class: 'auth-switch' },
      el('button', { text: 'Log out', onclick: async () => { await auth.signOut(); resetState(); renderAuth(); } }))
  ));
}

async function refreshMySets() {
  const uid = S.user.id;
  const [l, sv, fo, bl] = await Promise.all([
    reactions.myLikes(uid).catch(() => []),
    reactions.mySaves(uid).catch(() => []),
    follows.ids(uid).catch(() => []),
    safety.blockedIds(uid).catch(() => [])
  ]);
  S.likes = new Set(l); S.saves = new Set(sv);
  S.following = new Set(fo); S.blocked = new Set(bl);
  notifications.unreadCount(uid).then(n => { S.unread = n; paintBadges(); }).catch(() => {});
}

function startNotificationFeed() {
  notifications.subscribe(S.user.id, (n) => {
    if (n.user_id !== S.user.id) return;
    S.unread += 1; paintBadges();
    if (n.type !== 'message') toast(notifToastText(n));
  });
}

/* ========================================================== ROUTER */
function navigate(route, params = {}, replace = false) {
  S.route = route; S.params = params || {};
  const url = '#' + route + (params?.username ? '/' + params.username : params?.id ? '/' + params.id : '');
  try {
    history[replace ? 'replaceState' : 'pushState']({ route, params }, '', url);
  } catch {
    // Opaque origins (file://) can refuse pushState — fall back to the hash,
    // which the hashchange listener below picks up.
    location.hash = url;
  }
  renderShell();
}

function renderAuth(message = '') {
  $('#app-root').classList.add('hidden');
  const root = $('#auth-root');
  root.classList.remove('hidden');
  root.innerHTML = '';
  root.append(authLoginCard(message));
}

function authBrand() {
  return el('div', { class: 'brand' },
    el('div', { class: 'brand-mark', text: 'Z' }),
    el('div', { class: 'brand-name', html: 'Zon<em>k</em>' })
  );
}

function authLoginCard(message = '') {
  const card = el('div', { class: 'auth-card' });
  card.append(authBrand(), el('h2', { class: 'auth-title', text: 'Welcome back' }),
    el('p', { class: 'auth-sub', text: 'The funny side of the internet, one swipe away.' }));
  if (message) card.append(el('div', { class: 'alert alert-error', text: message }));

  const err = el('div', { class: 'alert alert-error hidden' });
  const email = el('input', { class: 'input', type: 'email', placeholder: 'you@example.com', autocomplete: 'email' });
  const pass = el('input', { class: 'input', type: 'password', placeholder: '••••••••', autocomplete: 'current-password' });
  const btn = el('button', { class: 'btn btn-primary', text: 'Log in' });

  // Prefill whoever logged in last on this device.
  email.value = auth.lastEmail();
  if (email.value) queueMicrotask(() => pass.focus());

  const remember = checkbox('Remember me', auth.getRemember(),
    'Stay signed in on this device. Unticked, you’ll be logged out when you close the browser.');

  card.append(err,
    el('div', { class: 'field' }, el('label', { text: 'Email' }), email),
    el('div', { class: 'field' },
      el('label', { text: 'Password' }),
      pass,
      el('div', { style: { textAlign: 'right', marginTop: '8px' } },
        el('button', { style: { fontSize: '12.5px', color: 'var(--accent-3)', fontWeight: '600' },
          text: 'Forgot password?', onclick: () => showForgot() }))
    ),
    remember.node,
    btn
  );

  const submit = async () => {
    err.classList.add('hidden');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      // Must happen before signIn — this is when the token is written, and the
      // choice decides whether it goes to local or session storage.
      auth.setRemember(remember.checked());
      auth.setLastEmail(remember.checked() ? email.value.trim() : '');
      await auth.signIn({ email: email.value.trim(), password: pass.value });
      const session = await auth.session();
      if (session?.user) await enterApp(session.user);
    } catch (e) {
      err.textContent = friendlyAuthError(e);
      err.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = 'Log in';
    }
  };
  btn.onclick = submit;
  pass.addEventListener('keydown', e => e.key === 'Enter' && submit());

  card.append(el('div', { class: 'auth-switch' },
    'New to Zonk? ', el('button', { text: 'Create an account', onclick: () => renderSignup() })),
    el('div', { class: 'auth-switch', style: { marginTop: '8px' } },
      el('button', { text: 'Resend confirmation email', onclick: () => showResend() })));
  return card;
}

function showResend() {
  const email = el('input', { class: 'input', type: 'email', placeholder: 'you@example.com' });
  const msg = el('div', { class: 'hidden' });
  const { modal } = openModal({
    title: 'Resend confirmation',
    body: el('div', {},
      el('p', { style: { color: 'var(--text-2)', marginTop: '0' }, text: 'We’ll send a fresh confirmation link to this address.' }),
      email, msg)
  });
  modal.append(el('div', { style: { marginTop: '18px' } },
    el('button', {
      class: 'btn btn-primary', text: 'Send link',
      onclick: async (ev) => {
        const b = ev.currentTarget;
        b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
        try {
          await auth.resendConfirmation(email.value.trim());
          msg.className = 'alert alert-ok';
          msg.textContent = 'Sent. Check your inbox.';
        } catch (e) {
          msg.className = 'alert alert-error';
          msg.textContent = friendlyAuthError(e);
        } finally {
          b.disabled = false; b.textContent = 'Send link';
        }
      }
    })));
}

function friendlyAuthError(e) {
  const m = (e?.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'Wrong email or password.';
  if (m.includes('email not confirmed')) return 'Please confirm your email first — check your inbox.';
  if (m.includes('rate limit')) return 'Too many attempts. Wait a minute and try again.';
  if (m.includes('already registered')) return 'That email already has an account. Try logging in.';
  if (m.includes('password should be')) return 'Password must be at least 6 characters.';
  return e?.message || 'Something went wrong.';
}

function renderSignup() {
  const root = $('#auth-root');
  root.innerHTML = '';
  const card = el('div', { class: 'auth-card' });
  card.append(authBrand(), el('h2', { class: 'auth-title', text: 'Join Zonk' }),
    el('p', { class: 'auth-sub', text: 'Claim your handle before someone funnier does.' }));

  const err = el('div', { class: 'alert alert-error hidden' });
  const email = el('input', { class: 'input', type: 'email', placeholder: 'you@example.com', autocomplete: 'email' });
  const uname = el('input', { class: 'input', type: 'text', placeholder: 'zonklegend', autocomplete: 'username', maxlength: 24 });
  const dname = el('input', { class: 'input', type: 'text', placeholder: 'Your display name', maxlength: 40 });
  const pass = el('input', { class: 'input', type: 'password', placeholder: 'At least 6 characters', autocomplete: 'new-password' });
  const uHint = el('div', { class: 'hint', text: 'Lowercase letters, numbers, _ and . — 3 to 24 characters.' });
  const btn = el('button', { class: 'btn btn-primary', text: 'Create account' });

  let available = false;
  const check = debounce(async () => {
    const v = uname.value.trim().toLowerCase();
    if (!/^[a-z0-9_.]{3,24}$/.test(v)) {
      available = false; uHint.className = 'hint'; uHint.textContent = 'Lowercase letters, numbers, _ and . — 3 to 24 characters.';
      return;
    }
    uHint.className = 'hint'; uHint.textContent = 'Checking availability…';
    try {
      available = await auth.usernameAvailable(v);
      uHint.className = 'hint ' + (available ? 'ok' : 'bad');
      uHint.textContent = available ? `@${v} is available 🎉` : `@${v} is taken — try another.`;
    } catch { available = true; uHint.textContent = 'Could not verify right now.'; }
  }, 420);
  uname.addEventListener('input', () => {
    uname.value = uname.value.toLowerCase().replace(/[^a-z0-9_.]/g, '');
    check();
  });

  if (!auth.canReceiveRedirects()) {
    card.append(el('div', { class: 'alert alert-error' },
      'You’re running this from a file:// page, so the confirmation email cannot link back to it. ' +
      'Serve the folder over http:// (node serve.mjs) and set that URL in Supabase → Authentication → URL Configuration.'));
  }

  card.append(err,
    el('div', { class: 'field' }, el('label', { text: 'Email' }), email),
    el('div', { class: 'field' },
      el('label', { text: 'Username' }),
      el('div', { class: 'input-affix' }, el('span', { class: 'at', text: '@' }), uname),
      uHint),
    el('div', { class: 'field' }, el('label', { text: 'Display name' }), dname),
    el('div', { class: 'field' }, el('label', { text: 'Password' }), pass),
    btn
  );

  btn.onclick = async () => {
    err.classList.add('hidden');
    const u = uname.value.trim().toLowerCase();
    if (!/^[a-z0-9_.]{3,24}$/.test(u)) return showErr('Pick a valid username first.');
    if ((pass.value || '').length < 6) return showErr('Password must be at least 6 characters.');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      const ok = await auth.usernameAvailable(u);
      if (!ok) throw new Error('That username was just taken — pick another.');
      const res = await auth.signUp({ email: email.value.trim(), password: pass.value, username: u, displayName: dname.value.trim() || u });
      if (res.session?.user) {
        await enterApp(res.session.user);
        toastOk('Welcome to Zonk!');
      } else {
        root.innerHTML = '';
        const ok = el('div', { class: 'auth-card' },
          authBrand(),
          el('h2', { class: 'auth-title', text: 'Confirm your email' }),
          el('p', { class: 'auth-sub', text: `We sent a confirmation link to ${email.value.trim()}. Click it, then log in.` }),
          el('button', { class: 'btn btn-primary', text: 'Back to login', onclick: () => renderAuth() })
        );
        root.append(ok);
      }
    } catch (e) {
      showErr(friendlyAuthError(e));
    } finally {
      btn.disabled = false; btn.textContent = 'Create account';
    }
  };
  function showErr(m) { err.textContent = m; err.classList.remove('hidden'); }

  card.append(el('div', { class: 'auth-switch' },
    'Already have an account? ', el('button', { text: 'Log in', onclick: () => renderAuth() })));
  root.append(card);
}

/* ---------------------------------------------------- onboarding flow */
function renderOnboarding() {
  const p = S.profile;
  let avatarFile = null;
  const avatarPreview = avatarEl(p, 96, false);

  const bio = el('textarea', { class: 'input', placeholder: 'Tell people what makes you laugh…', maxlength: 160 });
  const links = el('input', { class: 'input', placeholder: 'yourlink.com, @yourhandle' });
  const done = el('button', { class: 'btn btn-primary', text: 'Start watching' });

  const pickAvatar = async () => {
    const f = await pickFile('image/*');
    if (!f) return;
    avatarFile = f;
    avatarPreview.replaceWith(el('img', { class: 'avatar', src: URL.createObjectURL(f), width: 96, height: 96 }));
  };

  const card = el('div', { class: 'auth-card' },
    authBrand(),
    el('h2', { class: 'auth-title', text: 'Set up your profile' }),
    el('p', { class: 'auth-sub', text: 'Make it yours. You can change all of this later.' }),
    el('div', { style: { display: 'flex', justifyContent: 'center', margin: '8px 0 20px' } },
      el('button', { style: { position: 'relative' }, onclick: pickAvatar },
        avatarPreview,
        el('span', {
          style: {
            position: 'absolute', right: '-2px', bottom: '-2px', width: '30px', height: '30px',
            borderRadius: '99px', background: 'var(--grad-brand)', display: 'grid', placeItems: 'center'
          },
          html: icon('camera', 16)
        }))),
    el('div', { class: 'field' }, el('label', { text: 'Bio' }), bio),
    el('div', { class: 'field' }, el('label', { text: 'Links' }), links),
    done
  );

  done.onclick = async () => {
    done.disabled = true; done.innerHTML = '<span class="spinner"></span>';
    try {
      const patch = { onboarded: true, bio: bio.value.trim() };
      if (links.value.trim()) {
        patch.links = links.value.split(',').map(s => s.trim()).filter(Boolean).map(s => ({
          label: s.replace(/^https?:\/\//, '').replace(/^@/, ''),
          url: /^https?:\/\//.test(s) ? s : (/^@/.test(s) ? `https://x.com/${s.slice(1)}` : `https://${s}`)
        }));
      }
      if (avatarFile) patch.avatar_url = await profiles.uploadAvatar(S.user.id, avatarFile);
      S.profile = await profiles.update(S.user.id, patch);
      toastOk('Profile ready');
      navigate('feed', {}, true);
    } catch (e) {
      toastErr(e.message || 'Could not save profile');
    } finally {
      done.disabled = false; done.textContent = 'Start watching';
    }
  };

  $('#app-root').classList.add('hidden');
  const root = $('#auth-root');
  root.classList.remove('hidden');
  root.innerHTML = '';
  root.append(card);
}

/* ======================================================== APP SHELL */
function renderShell() {
  try { routeCleanup?.(); } catch { /* ignore */ }
  routeCleanup = null;
  $('#auth-root').classList.add('hidden');
  const app = $('#app-root');
  app.classList.remove('hidden');
  if (S.route === 'onboarding') return renderOnboarding();

  app.innerHTML = '';
  const layout = el('div', { class: 'layout' });

  /* sidebar (desktop) */
  const sidebar = el('aside', { class: 'sidebar' },
    el('div', { class: 'brand' }, el('div', { class: 'brand-mark', text: 'Z' }), el('div', { class: 'brand-name', html: 'Zon<em>k</em>' })),
    // Desktop entry point for Create. Without this the only way in was the
    // mobile bottom nav's `+`, which is hidden above the phone breakpoint — so
    // on a laptop there was no route to the upload screen at all.
    el('button', { class: 'side-create', onclick: () => navigate('create') },
      iconEl('plus'), el('span', { text: 'Create' })),
    navItem('feed', 'home', 'Home'),
    navItem('discover', 'search', 'Discover'),
    navItem('trending', 'fire', 'Trending'),
    navItem('messages', 'mail', 'Messages', 'dm'),
    navItem('notifications', 'bell', 'Notifications', 'notif'),
    navItem('profile', 'user', 'Profile'),
    el('div', { class: 'sidebar-foot' },
      el('button', { class: 'nav-item', onclick: () => navigate('settings') }, iconEl('settings'), el('span', { text: 'Settings' })),
      el('div', { class: 'sidebar-user', onclick: () => navigate('profile') },
        avatarEl(S.profile, 38),
        el('div', { class: 'meta' },
          el('b', { text: S.profile?.display_name || 'You' }),
          el('span', { text: '@' + (S.profile?.username || '') })))
    )
  );

  const main = el('main', { class: 'main' });
  const view = el('div', { class: 'view active' });
  main.append(view);

  layout.append(sidebar, main);
  app.append(layout);

  /* bottom nav (mobile) */
  const bn = el('nav', { class: 'bottomnav' },
    navItem('feed', 'home', 'Home', null, true),
    navItem('discover', 'search', 'Search', null, true),
    el('button', { class: 'create-btn', html: icon('plus', 21), onclick: () => navigate('create'), title: 'Create' }),
    navItem('notifications', 'bell', 'Alerts', 'notif', true),
    navItem('profile', 'user', 'Profile', null, true)
  );
  app.append(bn);

  /* mount the route */
  const routes = {
    feed: mountFeed, discover: mountDiscover, trending: mountTrending,
    notifications: mountNotifications, messages: mountMessages, thread: mountThread,
    profile: mountProfile, settings: mountSettings, create: mountCreate,
    tag: mountTag, post: mountPost, onboarding: renderOnboarding
  };
  (routes[S.route] || mountFeed)(view);
  paintBadges();
  if (S.route === 'notifications') notifications.markAllRead(S.user.id).then(() => { S.unread = 0; paintBadges(); });
}

function navItem(route, ic, label, badgeKey, mobile = false) {
  const active = S.route === route ||
    (route === 'profile' && ['settings', 'onboarding'].includes(S.route)) ||
    (route === 'messages' && S.route === 'thread') ||
    (route === 'discover' && S.route === 'tag') ||
    (route === 'feed' && S.route === 'post');
  const n = el('button', { class: `nav-item ${active ? 'active' : ''}`, onclick: () => navigate(route) },
    iconEl(ic, mobile ? 24 : 23),
    el('span', { text: label })
  );
  if (badgeKey) {
    const b = el('span', { class: 'badge hidden', dataset: { badge: badgeKey } });
    n.append(b);
  }
  return n;
}

function paintBadges() {
  $$('[data-badge]').forEach(b => {
    const key = b.dataset.badge;
    const val = key === 'notif' ? S.unread : key === 'dm' ? S.unreadDms : 0;
    if (val > 0) { b.textContent = val > 99 ? '99+' : val; b.classList.remove('hidden'); }
    else b.classList.add('hidden');
  });
}

  const tabs = el('div', { class: 'feed-tabs' },
    FEED_CATEGORIES.map(([key, label]) =>
      el('button', {
        class: S.feedCategory === key ? 'active' : '',
        text: label,
        onclick: () => { if (S.feedCategory !== key) { S.feedCategory = key; mountFeedInto(phone); } }
      }))
  );

  /* floating shortcuts — Messages has no slot in the 5-item bottom nav */
  const shortcuts = el('div', {
    style: {
      position: 'absolute', top: '12px', right: '12px', zIndex: '45',
      display: 'flex', gap: '6px'
    }
  },
    el('button', { class: 'icon-btn', style: { background: 'rgba(20,20,30,.55)', backdropFilter: 'blur(10px)' }, html: icon('search', 20), onclick: () => navigate('discover') }),
    el('button', { class: 'icon-btn', style: { background: 'rgba(20,20,30,.55)', backdropFilter: 'blur(10px)' }, html: icon('mail', 20), onclick: () => navigate('messages') })
  );

  const feedEl = el('div', { class: 'feed' });
  phone.append(tabs, shortcuts, feedEl);
  view.append(wrap);

  mountFeedInto(phone);
  return wrap;
}

async function mountFeedInto(phone) {
  $$('.feed-tabs button', phone).forEach(b => b.classList.toggle('active', b.textContent === (FEED_CATEGORIES.find(c => c[0] === S.feedCategory) || [])[1]));
  const feedEl = $('.feed', phone);
  feedEl.innerHTML = '';
  feedEl.append(skeletonList(2, window.innerHeight - 100));

  let items = S.feedCache[S.feedCategory];
  try {
    if (!items) {
      items = await posts.feed(S.feedCategory, { limit: 20, followingIds: [...S.following] });
      S.feedCache[S.feedCategory] = items;
    }
  } catch (e) {
    feedEl.innerHTML = '';
    feedEl.append(emptyState({ icon: 'flag', title: 'Feed unavailable', text: diagnose(e) }));
    return;
  }

  feedEl.innerHTML = '';
  if (!items.length) {
    feedEl.append(emptyState({
      icon: S.feedCategory === 'following' ? 'users' : 'video',
      title: S.feedCategory === 'following' ? 'Follow some creators' : 'No posts yet',
      text: S.feedCategory === 'following'
        ? 'Follow people and their clips show up right here.'
        : 'Be the first to post something funny.',
      action: el('button', {
        class: 'btn btn-primary', text: S.feedCategory === 'following' ? 'Find creators' : 'Create a post',
        onclick: () => navigate(S.feedCategory === 'following' ? 'discover' : 'create')
      })
    }));
    return;
  }

  const slides = items.map(p => feedSlide(p, feedEl));
  slides.forEach(s => feedEl.append(s));

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const v = en.target.querySelector('video');
      if (!v) return;
      if (en.isIntersecting && en.intersectionRatio > 0.6) {
        v.play().catch(() => {});
        v.dataset.seen = v.dataset.seen || '1';
        if (!v.dataset.counted) { v.dataset.counted = '1'; posts.registerView(en.target.dataset.id); }
        const idx = slides.indexOf(en.target);
        if (idx >= slides.length - 3) loadMoreFeed(feedEl);
      } else {
        v.pause();
      }
    });
  }, { threshold: [0, 0.6, 1], root: feedEl });
  slides.forEach(s => io.observe(s));

  // global mute state
  feedEl.addEventListener('click', e => {
    const ht = e.target.closest('[data-hashtag]');
    if (ht) { navigate('tag', { tag: ht.dataset.hashtag }); return; }
    const mt = e.target.closest('[data-mention]');
    if (mt) { navigate('profile', { username: mt.dataset.mention }); }
  });
}

async function loadMoreFeed(feedEl) {
  if (feedEl.dataset.loading === '1') return;
  const items = S.feedCache[S.feedCategory] || [];
  if (!items.length) return;
  feedEl.dataset.loading = '1';
  try {
    const cursor = items[items.length - 1].created_at;
    const more = await posts.feed(S.feedCategory, { limit: 12, cursor, followingIds: [...S.following] });
    const fresh = more.filter(m => !items.some(i => i.id === m.id));
    if (fresh.length) {
      S.feedCache[S.feedCategory] = items.concat(fresh);
      fresh.forEach(p => feedEl.append(feedSlide(p, feedEl)));
    }
  } catch { /* quiet */ }
  feedEl.dataset.loading = '0';
}

function feedSlide(p, feedEl) {
  const isVideo = p.kind === 'video';
  const liked = S.likes.has(p.id);
  const saved = S.saves.has(p.id);

  const slide = el('div', { class: 'slide', dataset: { id: p.id } });

  const media = isVideo
    ? el('video', { class: 'slide-media', src: p.media_url, loop: true, muted: true, playsinline: true, preload: 'metadata', poster: p.thumb_url || '' })
    : el('img', { class: 'slide-media slide-meme', src: p.media_url, alt: p.caption || 'meme', loading: 'lazy' });
  slide.append(media, el('div', { class: 'slide-shade' }));

  const playToggle = el('div', { class: 'play-toggle', html: icon('play', 34) });
  slide.append(playToggle);

  /* tap to pause / resume */
  const tap = el('div', { class: 'slide-tap' });
  tap.onclick = () => {
    if (!isVideo) return;
    if (media.paused) { media.play().catch(() => {}); playToggle.classList.remove('show'); }
    else { media.pause(); playToggle.innerHTML = icon('play', 34); playToggle.classList.add('show'); }
  };
  slide.append(tap);

  /* double-tap to like */
  let lastTap = 0;
  tap.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 320) {
      if (!S.likes.has(p.id)) doLike(p, likeBtn);
      burstHeart(slide);
    }
    lastTap = now;
  });

  /* caption + author */
  const author = p.author || {};
  const bottom = el('div', { class: 'slide-bottom' });
  const followChip = el('button', {
    class: `follow-chip ${S.following.has(author.id) ? 'following' : ''}`,
    text: S.following.has(author.id) ? 'Following' : 'Follow',
    onclick: async (ev) => {
      ev.stopPropagation();
      if (author.id === S.user.id) return;
      try {
        const now = await follows.toggle(S.user.id, author.id, S.following.has(author.id));
        now ? S.following.add(author.id) : S.following.delete(author.id);
        followChip.textContent = now ? 'Following' : 'Follow';
        followChip.classList.toggle('following', now);
        S.feedCache.following = null;
        toastOk(now ? `Following @${author.username}` : `Unfollowed @${author.username}`);
      } catch (e) { toastErr(e.message); }
    }
  });
  if (author.id !== S.user.id) {
    bottom.append(el('div', { class: 'slide-author' },
      avatarEl(author, 36),
      el('div', {},
        el('div', { class: 'name', text: author.display_name || author.username || 'unknown' }),
        el('div', { class: 'sub', text: '@' + (author.username || '') + ' · ' + timeAgo(p.created_at) })),
      followChip
    ));
  } else {
    bottom.append(el('div', { class: 'slide-author' },
      avatarEl(author, 36),
      el('div', {},
        el('div', { class: 'name', text: 'You' }),
        el('div', { class: 'sub', text: '@' + (author.username || '') + ' · ' + timeAgo(p.created_at) }))
    ));
  }
  if (p.caption) bottom.append(el('div', { class: 'slide-caption', html: linkifyCaption(p.caption) }));
  const soundLabel = (p.sound?.title || 'original sound') + ' · ' + (p.sound?.artist || author.username || 'zonk');
  const soundInner = el('span', { text: soundLabel });
  const marquee = el('div', { class: 'marquee' }, soundInner);
  // Only marquee when the label genuinely overflows — otherwise a short label
  // animates and shows a meaningless mid-scroll slice.
  requestAnimationFrame(() => {
    if (soundInner.scrollWidth > marquee.clientWidth) {
      soundInner.textContent = soundLabel + '    ' + soundLabel + '    ';
      soundInner.classList.add('scrolling');
    }
  });
  // The sound row doubles as the play/pause control when the post has a real
  // track attached. Posts with only a typed-in label stay non-interactive.
  const track = trackFromSound(p.sound);
  const soundIcon = el('span', { class: 'sound-icon', html: icon('music', 14) });
  const soundRow = el('div', { class: 'slide-sound' + (track ? ' playable' : '') },
    soundIcon,
    marquee,
    el('span', { style: { marginLeft: 'auto', opacity: '.7', display: 'flex', gap: '4px', alignItems: 'center' } },
      iconEl('eye', 14), compact(p.view_count))
  );

  if (track) {
    soundRow.title = 'Play ' + track.title;
    soundRow.onclick = (e) => {
      e.stopPropagation();
      music.toggle(track);
    };
    // Reflect playing state on the icon so the row reads as a control.
    const unsubMusic = music.onMusicChange((np) => {
      const on = np && np.playing && np.provider === track.provider && np.externalId === track.externalId;
      soundRow.classList.toggle('playing', !!on);
      soundIcon.innerHTML = icon(on ? 'pause' : 'play', 14);
    });
    if (routeCleanup) { const prev = routeCleanup; routeCleanup = () => { unsubMusic(); prev(); }; }
    else routeCleanup = unsubMusic;
  }

  bottom.append(soundRow);
  slide.append(bottom);

  /* action rail */
  const likeBtn = railBtn(liked ? 'heartFull' : 'heart', compact(p.like_count), liked ? 'on' : '', async () => doLike(p, likeBtn));
  const commentBtn = railBtn('comment', compact(p.comment_count), '', () => openComments(p));
  const shareBtn = railBtn('share', compact(p.share_count), '', () => openShare(p));
  const saveBtn = railBtn(saved ? 'bookmarkFull' : 'bookmark', compact(p.save_count), saved ? 'on save' : 'save', async () => {
    try {
      const now = await reactions.toggleSave(S.user.id, p.id, S.saves.has(p.id));
      now ? S.saves.add(p.id) : S.saves.delete(p.id);
      saveBtn.classList.toggle('on', now);
      $('.ico', saveBtn).innerHTML = icon(now ? 'bookmarkFull' : 'bookmark', 23);
      $('.n', saveBtn).textContent = compact(Math.max(0, (p.save_count || 0) + (now ? 1 : -1)));
      toast(now ? 'Saved to your collection' : 'Removed from saved');
    } catch (e) { toastErr(e.message); }
  });

  const disc = el('div', { class: 'spin-disc' },
    p.thumb_url ? el('img', { src: p.thumb_url, style: { width: '100%', height: '100%', objectFit: 'cover' } })
      : el('div', { style: { width: '100%', height: '100%', background: `linear-gradient(135deg, ${hueFor(p.id)}, #000)` } })
  );

  const rail = el('div', { class: 'rail' });
  if (author.id !== S.user.id) {
    rail.append(el('div', { class: 'rail-avatar' },
      avatarEl(author, 42),
      el('span', { class: 'plus', html: icon('plus', 12), onclick: async (ev) => {
        ev.stopPropagation();
        if (S.following.has(author.id)) return;
        try {
          await follows.toggle(S.user.id, author.id, false);
          S.following.add(author.id);
          ev.currentTarget.style.display = 'none';
          followChip.textContent = 'Following';
          followChip.classList.add('following');
          toastOk(`Following @${author.username}`);
        } catch (e) { toastErr(e.message); }
      } })
    ));
  }
  rail.append(likeBtn, commentBtn, shareBtn, saveBtn, disc);
  slide.append(rail);

  if (isVideo) {
    media.addEventListener('play', () => disc.classList.remove('paused'));
    media.addEventListener('pause', () => disc.classList.add('paused'));
  } else {
    disc.classList.add('paused');
  }
  return slide;
}

function railBtn(ic, count, extra = '', onclick) {
  const b = el('button', { class: `rail-btn ${extra}` },
    el('span', { class: 'ico', html: icon(ic, 23) }),
    el('span', { class: 'n', text: count }));
  b.onclick = (e) => { e.stopPropagation(); onclick?.(e); };
  return b;
}

async function doLike(p, btn) {
  const liked = S.likes.has(p.id);
  // optimistic
  liked ? S.likes.delete(p.id) : S.likes.add(p.id);
  btn.classList.toggle('on', !liked);
  $('.ico', btn).innerHTML = icon(!liked ? 'heartFull' : 'heart', 23);
  $('.n', btn).textContent = compact(Math.max(0, (p.like_count || 0) + (!liked ? 1 : -1)));
  try {
    await reactions.toggleLike(S.user.id, p.id, liked);
    p.like_count = Math.max(0, (p.like_count || 0) + (!liked ? 1 : -1));
  } catch (e) {
    liked ? S.likes.add(p.id) : S.likes.delete(p.id);
    btn.classList.toggle('on', liked);
    $('.ico', btn).innerHTML = icon(liked ? 'heartFull' : 'heart', 23);
    toastErr(e.message || 'Could not update like');
  }
}

function burstHeart(host) {
  const h = el('div', {
    style: {
      position: 'absolute', left: '50%', top: '46%', transform: 'translate(-50%,-50%) scale(.5)',
      zIndex: '20', pointerEvents: 'none', color: '#FF4D8D', opacity: '0',
      transition: 'transform .5s cubic-bezier(.22,1,.36,1), opacity .5s'
    },
    html: icon('heartFull', 96)
  });
  host.append(h);
  requestAnimationFrame(() => {
    h.style.opacity = '.95';
    h.style.transform = 'translate(-50%,-50%) scale(1.15)';
  });
  setTimeout(() => { h.style.opacity = '0'; h.style.transform = 'translate(-50%,-90%) scale(1.3)'; }, 420);
  setTimeout(() => h.remove(), 950);
}

/* ========================================================= COMMENTS */
async function openComments(p) {
  const body = el('div');
  const list = el('div');
  body.append(list);
  list.append(skeletonList(4, 54));

  const input = el('input', { class: 'input', placeholder: 'Add a comment…', maxlength: 500 });
  const sendBtn = el('button', { class: 'icon-btn', html: icon('send', 20), style: { color: 'var(--accent-3)' } });
  let replyTo = null;
  let all = [];
  let myCommentLikes = new Set();

  const emojiRow = el('div', { class: 'emoji-row' },
    EMOJIS.map(e => el('button', { text: e, onclick: () => { input.value += e; input.focus(); } })));

  const foot = el('div', {}, emojiRow, el('div', { class: 'comment-bar' }, input, sendBtn));
  const sheet = openSheet({ title: `Comments · ${compact(p.comment_count)}`, body, foot });

  try {
    [all, myCommentLikes] = await Promise.all([
      comments.list(p.id),
      comments.myCommentLikes(S.user.id).catch(() => [])
    ]);
    myCommentLikes = new Set(myCommentLikes);
  } catch (e) {
    list.innerHTML = '';
    list.append(emptyState({ icon: 'flag', title: 'Comments unavailable', text: diagnose(e) }));
    return;
  }

  function renderComments() {
    list.innerHTML = '';
    if (!all.length) {
      list.append(emptyState({ icon: 'comment', title: 'No comments yet', text: 'Be the first to say something unhinged.' }));
      return;
    }
    const roots = all.filter(c => !c.parent_id);
    const kidsOf = id => all.filter(c => c.parent_id === id);
    roots.forEach(c => list.append(commentNode(c, kidsOf, 0)));
  }

  function commentNode(c, kidsOf, depth) {
    const liked = myCommentLikes.has(c.id);
    const mine = c.author_id === S.user.id;
    const node = el('div', { class: 'comment' },
      avatarEl(c.author, 36),
      el('div', { class: 'body' },
        el('div', { class: 'who' }, el('b', { text: '@' + (c.author?.username || 'user') }), ' · ' + timeAgo(c.created_at)),
        el('div', { class: 'text', html: linkifyCaption(c.body) }),
        el('div', { class: 'actions' },
          el('button', {
            text: 'Reply',
            onclick: () => {
              replyTo = c;
              input.placeholder = `Replying to @${c.author?.username}…`;
              input.focus();
            }
          }),
          mine ? el('button', { text: 'Delete', onclick: async () => {
            if (!await confirmDialog({ title: 'Delete comment?', message: 'This cannot be undone.', confirmLabel: 'Delete', danger: true })) return;
            try {
              await comments.remove(c.id);
              all = all.filter(x => x.id !== c.id && x.parent_id !== c.id);
              renderComments();
              toastOk('Comment deleted');
            } catch (e) { toastErr(e.message); }
          } }) : null,
          !mine ? el('button', { text: 'Report', onclick: () => openReport({ targetType: 'comment', targetId: c.id, label: 'comment' }) }) : null
        ),
        kidsOf(c.id).length
          ? el('div', { class: 'replies' }, kidsOf(c.id).map(k => commentNode(k, kidsOf, depth + 1)))
          : null
      ),
      el('button', {
        class: `like-col ${liked ? 'liked' : ''}`,
        html: icon(liked ? 'heartFull' : 'heart', 16) + `<span>${compact(c.like_count)}</span>`,
        onclick: async (ev) => {
          const b = ev.currentTarget;
          const now = !myCommentLikes.has(c.id);
          now ? myCommentLikes.add(c.id) : myCommentLikes.delete(c.id);
          b.classList.toggle('liked', now);
          b.innerHTML = icon(now ? 'heartFull' : 'heart', 16) + `<span>${compact(Math.max(0, c.like_count + (now ? 1 : -1)))}</span>`;
          try { await comments.toggleLike(S.user.id, c.id, !now); } catch { /* ignore */ }
        }
      })
    );
    return node;
  }

  renderComments();

  sendBtn.onclick = async () => {
    const text = input.value.trim();
    if (!text) return;
    sendBtn.innerHTML = '<span class="spinner"></span>';
    try {
      const mentions = [];
      for (const u of extractMentions(text)) {
        const pr = await profiles.byUsername(u);
        if (pr) mentions.push(pr.id);
      }
      const created = await comments.add({
        postId: p.id, authorId: S.user.id, body: text,
        parentId: replyTo?.id || null, mentions
      });
      all.push(created);
      p.comment_count = (p.comment_count || 0) + 1;
      input.value = '';
      replyTo = null;
      input.placeholder = 'Add a comment…';
      renderComments();
      list.scrollTop = list.scrollHeight;
    } catch (e) {
      toastErr(e.message || 'Could not post comment');
    } finally {
      sendBtn.innerHTML = icon('send', 20);
    }
  };
  input.addEventListener('keydown', e => e.key === 'Enter' && sendBtn.click());
  sheet.bodyEl.scrollTop = sheet.bodyEl.scrollHeight;
}

/* ============================================================ SHARE */
function shareUrl(p) {
  return `${location.origin}${location.pathname}#post/${p.id}`;
}

function openShare(p) {
  const body = el('div', {});
  const doShare = async (channel, label) => {
    try {
      if (channel === 'native' && navigator.share) {
        await navigator.share({ title: 'Zonk', text: p.caption || 'Check this out on Zonk', url: shareUrl(p) });
        await reactions.recordShare(S.user.id, p.id, 'native');
        toastOk('Shared');
        closeAll();
        return;
      }
      if (channel === 'link') {
        await navigator.clipboard.writeText(shareUrl(p));
        await reactions.recordShare(S.user.id, p.id, 'link');
        toastOk('Link copied');
        closeAll();
        return;
      }
      if (channel === 'dm') {
        closeAll();
        openSendToFriends(p);
        return;
      }
      // external channels: use the OS share sheet when available
      const text = encodeURIComponent(`${p.caption || 'Check this out on Zonk'} ${shareUrl(p)}`);
      const urls = {
        x: `https://twitter.com/intent/tweet?text=${text}`,
        whatsapp: `https://wa.me/?text=${text}`,
        reddit: `https://www.reddit.com/submit?url=${encodeURIComponent(shareUrl(p))}&title=${encodeURIComponent(p.caption || 'Zonk')}`,
        telegram: `https://t.me/share/url?url=${encodeURIComponent(shareUrl(p))}&text=${encodeURIComponent(p.caption || '')}`
      };
      window.open(urls[channel], '_blank', 'noopener');
      await reactions.recordShare(S.user.id, p.id, channel);
      toastOk(`Sharing to ${label}`);
      closeAll();
    } catch (e) {
      if (e?.name !== 'AbortError') toastErr('Share failed');
    }
  };

  body.append(el('div', { class: 'menu' },
    navigator.share ? menuBtn('send', 'Share via…', () => doShare('native', 'device')) : null,
    menuBtn('link', 'Copy link', () => doShare('link', 'link')),
    menuBtn('mail', 'Send to a friend on Zonk', () => doShare('dm', 'Zonk')),
    menuBtn('at', 'Share to X', () => doShare('x', 'X')),
    menuBtn('comment', 'Share to WhatsApp', () => doShare('whatsapp', 'WhatsApp')),
    menuBtn('send', 'Share to Telegram', () => doShare('telegram', 'Telegram')),
    menuBtn('sparkle', 'Share to Reddit', () => doShare('reddit', 'Reddit'))
  ));
  openSheet({ title: 'Share this post', body });
}

function menuBtn(ic, label, onclick, danger = false) {
  return el('button', { class: danger ? 'danger' : '', onclick },
    iconEl(ic, 20), el('span', { text: label }));
}

async function openSendToFriends(p) {
  const body = el('div');
  body.append(skeletonList(5, 56));
  const sheet = openSheet({ title: 'Send to…', body });
  try {
    const list = await profiles.following(S.user.id);
    body.innerHTML = '';
    if (!list.length) {
      body.append(emptyState({ icon: 'users', title: 'No one to send to yet', text: 'Follow a few people first.' }));
      return;
    }
    list.forEach(u => body.append(el('div', { class: 'user-row', onclick: async () => {
      try {
        const convId = await messaging.getOrCreateDM(u.id);
        await messaging.send({ conversationId: convId, senderId: S.user.id, body: p.caption || '', postId: p.id });
        await reactions.recordShare(S.user.id, p.id, 'dm');
        closeAll();
        toastOk(`Sent to @${u.username}`);
        navigate('thread', { id: convId });
      } catch (e) { toastErr(e.message); }
    } },
      avatarEl(u, 44),
      el('div', { class: 'meta' }, el('b', { text: u.display_name || u.username }), el('span', { text: '@' + u.username })),
      el('button', { class: 'btn btn-primary btn-sm', text: 'Send' })
    )));
  } catch (e) {
    body.innerHTML = '';
    body.append(emptyState({ icon: 'flag', title: 'Could not load friends', text: diagnose(e) }));
  }
  return sheet;
}

/* ========================================================== DISCOVER */
async function mountDiscover(view) {
  const scroll = el('div', { class: 'view-scroll' });
  const phone = el('div', { class: 'phone-col' });
  scroll.append(phone);
  view.append(scroll);

  const input = el('input', { class: 'input', placeholder: 'Search users, memes, videos, #tags', autocomplete: 'off' });
  const bar = el('div', { class: 'topbar' }, input);
  phone.append(bar);

  const results = el('div', { class: 'hidden' });
  const browse = el('div');
  phone.append(browse, results);

  let mode = 'all';
  const chips = el('div', { class: 'chip-scroll' },
    [['all', 'All'], ['users', 'Creators'], ['video', 'Videos'], ['meme', 'Memes'], ['tags', 'Hashtags']].map(([k, l]) =>
      el('button', { class: `chip ${k === 'all' ? 'active' : ''}`, text: l, dataset: { mode: k }, onclick: (e) => {
        mode = k;
        $$('.chip', chips).forEach(c => c.classList.toggle('active', c === e.currentTarget));
        if (input.value.trim()) runSearch(input.value.trim());
      } }))
  );
  results.append(chips);

  const out = el('div');
  results.append(out);

  phone.append(el('div', { style: { height: '8px' } }));

  const runSearch = debounce(async (q) => {
    if (!q) { results.classList.add('hidden'); browse.classList.remove('hidden'); return; }
    results.classList.remove('hidden'); browse.classList.add('hidden');
    out.innerHTML = '';
    out.append(skeletonList(4, 56));
    try {
      const jobs = [];
      if (mode === 'all' || mode === 'users') jobs.push(profiles.search(q).then(r => ['users', r]));
      if (mode === 'all' || mode === 'video') jobs.push(posts.search(q, 'video').then(r => ['video', r]));
      if (mode === 'all' || mode === 'meme') jobs.push(posts.search(q, 'meme').then(r => ['meme', r]));
      if (mode === 'all' || mode === 'tags') jobs.push(hashtags.search(q).then(r => ['tags', r]));
      const settled = await Promise.all(jobs.map(j => j.catch(() => null)));
      out.innerHTML = '';
      let any = false;

      for (const [kind, rows] of settled) {
        if (!rows) continue;
        if (kind === 'users' && rows.length) {
          any = true;
          out.append(el('div', { class: 'section-head', style: { padding: '14px 16px 4px' } }, el('h3', { text: 'Creators' })));
          rows.forEach(u => out.append(userRow(u)));
        }
        if ((kind === 'video' || kind === 'meme') && rows.length) {
          any = true;
          out.append(el('div', { class: 'section-head', style: { padding: '14px 16px 4px' } },
            el('h3', { text: kind === 'video' ? 'Videos' : 'Memes' })));
          out.append(tileGrid(rows));
        }
        if (kind === 'tags' && rows.length) {
          any = true;
          out.append(el('div', { class: 'section-head', style: { padding: '14px 16px 4px' } }, el('h3', { text: 'Hashtags' })));
          const wrap = el('div', { class: 'hscroll' });
          rows.forEach(t => wrap.append(el('button', { class: 'tag-pill', onclick: () => navigate('tag', { tag: t.tag }) },
            el('span', { text: '#' + t.tag }), el('span', { class: 'cnt', text: compact(t.post_count) + ' posts' }))));
          out.append(wrap);
        }
      }
      if (!any) out.append(emptyState({ icon: 'search', title: `No results for “${q}”`, text: 'Try a different word or hashtag.' }));
    } catch (e) {
      out.innerHTML = '';
      out.append(emptyState({ icon: 'flag', title: 'Search failed', text: diagnose(e) }));
    }
  }, 340);

  input.addEventListener('input', () => runSearch(input.value.trim()));

  /* ------- discover default view ------- */
  browse.append(skeletonList(3, 110));
  try {
    const [trendTags, creators, trendingVids, memes] = await Promise.all([
      hashtags.trending(12),
      profiles.popular(12),
      posts.feed('trending', { limit: 12 }),
      posts.feed('new', { limit: 24 }).then(r => r.filter(p => p.kind === 'meme').slice(0, 12))
    ]);

    browse.innerHTML = '';

    if (trendTags.length) {
      browse.append(el('div', { class: 'section-head', style: { padding: '16px 16px 8px' } },
        el('h3', { text: '🔥 Trending hashtags' })));
      const wrap = el('div', { class: 'hscroll' });
      trendTags.forEach(t => wrap.append(el('button', {
        class: 'tag-pill', onclick: () => navigate('tag', { tag: t.tag })
      }, el('span', { text: '#' + t.tag }), el('span', { class: 'cnt', text: compact(t.post_count) }))));
      browse.append(wrap);
    }

    if (creators.length) {
      browse.append(el('div', { class: 'section-head', style: { padding: '16px 16px 8px' } },
        el('h3', { text: 'Creators to watch' }), el('div', { class: 'spacer' })));
      const wrap = el('div', { class: 'hscroll' });
      creators.forEach(u => wrap.append(creatorCard(u)));
      browse.append(wrap);
    }

    if (trendingVids.length) {
      browse.append(el('div', { class: 'section-head', style: { padding: '16px 16px 8px' } },
        el('h3', { text: 'Popular videos' }),
        el('div', { class: 'spacer' }),
        el('button', { class: 'more', text: 'See all', onclick: () => navigate('trending') })));
      browse.append(tileGrid(trendingVids.slice(0, 9)));
    }

    if (memes.length) {
      browse.append(el('div', { class: 'section-head', style: { padding: '18px 16px 8px' } },
        el('h3', { text: '😹 Fresh memes' })));
      browse.append(tileGrid(memes.slice(0, 9)));
    }

    if (!trendTags.length && !creators.length && !trendingVids.length && !memes.length) {
      browse.append(emptyState({
        icon: 'sparkle', title: 'Nothing here yet',
        text: 'Post the first thing — the discover page fills up fast.',
        action: el('button', { class: 'btn btn-primary', text: 'Create a post', onclick: () => navigate('create') })
      }));
    }
  } catch (e) {
    browse.innerHTML = '';
    browse.append(emptyState({ icon: 'flag', title: 'Could not load discover', text: diagnose(e) }));
  }
}

function userRow(u, trailing) {
  return el('div', { class: 'user-row', onclick: () => navigate('profile', { id: u.id }) },
    avatarEl(u, 46),
    el('div', { class: 'meta' },
      el('b', { text: u.display_name || u.username }),
      el('span', { text: '@' + u.username + (u.bio ? ' · ' + u.bio : '') })),
    trailing || followMiniBtn(u)
  );
}

function followMiniBtn(u) {
  if (u.id === S.user.id) return null;
  const btn = el('button', {
    class: `btn btn-sm ${S.following.has(u.id) ? 'btn-ghost' : 'btn-primary'}`,
    text: S.following.has(u.id) ? 'Following' : 'Follow'
  });
  btn.onclick = async (e) => {
    e.stopPropagation();
    try {
      const now = await follows.toggle(S.user.id, u.id, S.following.has(u.id));
      now ? S.following.add(u.id) : S.following.delete(u.id);
      btn.textContent = now ? 'Following' : 'Follow';
      btn.className = `btn btn-sm ${now ? 'btn-ghost' : 'btn-primary'}`;
      S.feedCache.following = null;
    } catch (err) { toastErr(err.message); }
  };
  return btn;
}

function creatorCard(u) {
  const card = el('div', {
    class: 'card tap',
    style: { width: '132px', flex: 'none', textAlign: 'center', cursor: 'pointer' },
    onclick: () => navigate('profile', { id: u.id })
  },
    el('div', { style: { display: 'flex', justifyContent: 'center', marginBottom: '10px' } }, avatarEl(u, 62, true)),
    el('div', { style: { fontWeight: '700', fontSize: '14px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }, text: u.display_name || u.username }),
    el('div', { style: { fontSize: '12px', color: 'var(--text-3)', marginBottom: '10px' }, text: compact(u.follower_count) + ' followers' }),
    followMiniBtn(u)
  );
  return card;
}

function tileGrid(rows) {
  const g = el('div', { class: 'grid-3' });
  rows.forEach(p => g.append(tile(p)));
  return g;
}

function tile(p) {
  const t = el('div', { class: 'tile', onclick: () => navigate('post', { id: p.id }) });
  if (p.kind === 'video') {
    t.append(el('video', { src: p.media_url, muted: true, playsinline: true, preload: 'metadata', poster: p.thumb_url || '' }));
    t.append(el('span', { class: 'kind-pill', text: 'video' }));
  } else {
    t.append(el('img', { src: p.media_url, alt: '', loading: 'lazy' }));
    t.append(el('span', { class: 'kind-pill', text: 'meme' }));
  }
  t.append(el('div', { class: 'tile-meta' },
    el('span', { style: { display: 'flex', alignItems: 'center', gap: '4px' } }, iconEl('heartFull', 13), compact(p.like_count)),
    el('span', { style: { display: 'flex', alignItems: 'center', gap: '4px' } }, iconEl('eye', 13), compact(p.view_count))
  ));
  return t;
}

/* ========================================================== TRENDING */

  const scroll = el('div', { class: 'view-scroll' });
  const phone = el('div', { class: 'phone-col' });
  scroll.append(phone);
  view.append(scroll);
  phone.append(el('div', { class: 'topbar' }, el('h2', { text: '🔥 Trending now' })));

  const body = el('div');
  phone.append(body);
  body.append(skeletonList(4, 110));

  try {
    const [vids, memes, tags, creators] = await Promise.all([
      posts.feed('trending', { limit: 24 }),
      posts.feed('trending', { limit: 40 }).then(r => r.filter(p => p.kind === 'meme')),
      hashtags.trending(20),
      profiles.popular(12)
    ]);
    body.innerHTML = '';

    if (tags.length) {
      body.append(el('div', { class: 'section-head', style: { padding: '18px 16px 8px' } }, el('h3', { text: 'Viral hashtags' })));
      const wrap = el('div', { class: 'hscroll' });
      tags.forEach((t, i) => wrap.append(el('button', { class: 'tag-pill', onclick: () => navigate('tag', { tag: t.tag }) },
        el('span', { style: { color: 'var(--text-3)', fontWeight: '700' }, text: '#' + (i + 1) }),
        el('span', { text: '#' + t.tag }),
        el('span', { class: 'cnt', text: compact(t.post_count) }))));
      body.append(wrap);
    }

    if (vids.length) {
      body.append(el('div', { class: 'section-head', style: { padding: '18px 16px 8px' } }, el('h3', { text: 'Trending videos' })));
      body.append(tileGrid(vids.slice(0, 12)));
    }
    if (memes.length) {
      body.append(el('div', { class: 'section-head', style: { padding: '18px 16px 8px' } }, el('h3', { text: 'Trending memes' })));
      body.append(tileGrid(memes.slice(0, 9)));
    }
    if (creators.length) {
      body.append(el('div', { class: 'section-head', style: { padding: '18px 16px 8px' } }, el('h3', { text: 'Popular creators' })));
      creators.forEach(u => body.append(userRow(u)));
    }
    if (!vids.length && !memes.length && !tags.length) {
      body.append(emptyState({ icon: 'fire', title: 'No trends yet', text: 'Trends appear as people post and react.' }));
    }
  } catch (e) {
    body.innerHTML = '';
    body.append(emptyState({ icon: 'flag', title: 'Could not load trends', text: diagnose(e) }));
  }
}

async function mountTag(view) {
  const scroll = el('div', { class: 'view-scroll' });
  const phone = el('div', { class: 'phone-col' });
  scroll.append(phone);
  view.append(scroll);

  const tag = S.params.tag || '';
  phone.append(el('div', { class: 'topbar' },

  ));
  const body = el('div');
  phone.append(body);
  body.append(skeletonList(3, 110));

  try {
    const rows = await posts.byHashtag(tag);
    body.innerHTML = '';
