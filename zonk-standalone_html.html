/* ==========================================================================
   ZONK · design system
   dark-first, energetic, mobile-first. desktop gets a sidebar + centred feed.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg:          #08080D;
  --bg-2:        #0E0E16;
  --surface:     #14141F;
  --surface-2:   #1C1C2A;
  --surface-3:   #26263A;
  --line:        rgba(255,255,255,.08);
  --line-2:      rgba(255,255,255,.14);

  --text:        #F4F4FA;
  --text-2:      #A9A9BE;
  --text-3:      #6E6E85;

  --accent:      #7C5CFF;   /* violet   */
  --accent-2:    #FF4D8D;   /* hot pink */
  --accent-3:    #22E0B8;   /* mint     */
  --accent-4:    #FFB020;   /* amber    */
  --danger:      #FF4D4D;

  --grad-brand:  linear-gradient(135deg, #7C5CFF 0%, #FF4D8D 100%);
  --grad-hot:    linear-gradient(135deg, #FF4D8D 0%, #FFB020 100%);
  --grad-mint:   linear-gradient(135deg, #22E0B8 0%, #7C5CFF 100%);

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;
  --r-pill: 999px;

  --nav-h: 62px;
  --sidebar-w: 248px;
  --feed-w: 430px;
  --shadow: 0 18px 50px rgba(0,0,0,.55);
  --shadow-sm: 0 6px 20px rgba(0,0,0,.35);

  --ease: cubic-bezier(.22,1,.36,1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.45;
  overscroll-behavior-y: none;
}

body { overflow: hidden; }

h1,h2,h3,h4,.font-display { font-family: 'Space Grotesk', Inter, sans-serif; letter-spacing: -.02em; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
img, video { display: block; max-width: 100%; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a52; }

.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- ambient background ---------- */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(620px 420px at 12% -6%, rgba(124,92,255,.20), transparent 62%),
    radial-gradient(560px 400px at 92% 4%, rgba(255,77,141,.14), transparent 60%),
    radial-gradient(700px 520px at 50% 108%, rgba(34,224,184,.10), transparent 62%);
}

/* ==========================================================================
   AUTH
   ========================================================================== */
#auth-root {
  position: relative; z-index: 2;
  height: 100%; overflow-y: auto;
  display: flex; align-items: center; justify-content: center;
  padding: 28px 18px;
}
.auth-card {
  width: 100%; max-width: 440px;
  background: linear-gradient(180deg, rgba(28,28,42,.92), rgba(14,14,22,.96));
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 34px 30px 30px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  animation: rise .5s var(--ease);
}
@keyframes rise { from { opacity:0; transform: translateY(22px) scale(.985); } }

.brand { display: flex; align-items: center; gap: 11px; margin-bottom: 6px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px; flex: none;
  background: var(--grad-brand);
  display: grid; place-items: center;
  font-family: 'Space Grotesk'; font-weight: 700; font-size: 22px; color: #fff;
  box-shadow: 0 8px 26px rgba(124,92,255,.5);
  transform: rotate(-6deg);
}
.brand-name { font-family: 'Space Grotesk'; font-weight: 700; font-size: 27px; letter-spacing: -.04em; }
.brand-name em { font-style: normal; background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }

.auth-title { font-size: 24px; margin: 20px 0 4px; }
.auth-sub { color: var(--text-2); font-size: 14px; margin: 0 0 22px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; letter-spacing: .01em; }
.input {
  width: 100%; padding: 13px 14px;
  background: rgba(255,255,255,.045);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  color: var(--text); outline: none;
  transition: border-color .18s, background .18s, box-shadow .18s;
}
.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--accent); background: rgba(124,92,255,.09); box-shadow: 0 0 0 4px rgba(124,92,255,.14); }
textarea.input { resize: vertical; min-height: 84px; }

.input-affix { position: relative; }
.input-affix .at { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-weight: 600; }
.input-affix .input { padding-left: 30px; }

.hint { font-size: 12.5px; margin-top: 6px; color: var(--text-3); }
.hint.ok { color: var(--accent-3); }
.hint.bad { color: var(--danger); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 18px; border-radius: var(--r-pill);
  font-weight: 600; font-size: 14.5px;
  transition: transform .16s var(--ease), filter .18s, background .18s, opacity .18s;
  white-space: nowrap;
}
.btn:active { transform: scale(.965); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-primary { background: var(--grad-brand); color: #fff; box-shadow: 0 8px 26px rgba(124,92,255,.38); width: 100%; }
.btn-primary:hover { filter: brightness(1.09); }
.btn-ghost { background: rgba(255,255,255,.07); color: var(--text); }
.btn-ghost:hover { background: rgba(255,255,255,.12); }
.btn-outline { border: 1px solid var(--line-2); color: var(--text); }
.btn-outline:hover { background: rgba(255,255,255,.06); }
.btn-danger { background: rgba(255,77,77,.14); color: #ff8f8f; border: 1px solid rgba(255,77,77,.3); }
.btn-sm { padding: 8px 15px; font-size: 13px; }
.btn-block { width: 100%; }

.auth-switch { text-align: center; margin-top: 18px; font-size: 13.5px; color: var(--text-2); }
.auth-switch button { color: var(--accent-3); font-weight: 600; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; margin: 18px 0; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--line); }

.alert { padding: 11px 14px; border-radius: var(--r-md); font-size: 13.5px; margin-bottom: 14px; }
.alert-error { background: rgba(255,77,77,.12); border: 1px solid rgba(255,77,77,.28); color: #ffb3b3; }
.alert-ok { background: rgba(34,224,184,.1); border: 1px solid rgba(34,224,184,.28); color: #8ff0dc; }

/* ==========================================================================
   APP SHELL
   ========================================================================== */
#app-root { position: relative; z-index: 2; height: 100%; }

.layout { display: flex; height: 100%; }

/* sidebar (desktop) */
.sidebar {
  display: none;
  width: var(--sidebar-w); flex: none;
  flex-direction: column; gap: 4px;
  padding: 22px 14px;
  border-right: 1px solid var(--line);
  background: rgba(10,10,16,.6);
  backdrop-filter: blur(14px);
}
.sidebar .brand { margin: 0 8px 22px; }

/* Desktop Create button. The mobile bottom nav's `+` is hidden above the phone
   breakpoint, so this is the only way into the upload screen on a laptop. */
.side-create {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; margin: 0 0 16px;
  padding: 13px 14px; border: 0; border-radius: var(--r-pill);
  background: var(--grad-brand); color: #fff;
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 8px 22px rgba(124,92,255,.34);
  transition: transform .16s var(--ease), filter .18s, box-shadow .18s;
}
.side-create:hover { filter: brightness(1.09); box-shadow: 0 10px 26px rgba(124,92,255,.46); }
.side-create:active { transform: scale(.975); }
.side-create svg { width: 19px; height: 19px; }

.nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px; border-radius: var(--r-md);
  color: var(--text-2); font-weight: 600; font-size: 15px;
  transition: background .18s, color .18s, transform .16s var(--ease);
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
.nav-item.active { background: rgba(124,92,255,.15); color: #fff; }
.nav-item.active::before {
  content:''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px;
  border-radius: 0 4px 4px 0; background: var(--grad-brand);
}
.nav-item svg { width: 23px; height: 23px; flex: none; }
.nav-item .badge { margin-left: auto; }
.sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }

.sidebar-user {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: var(--r-md); cursor: pointer; transition: background .18s;
}
.sidebar-user:hover { background: rgba(255,255,255,.06); }
.sidebar-user .meta { min-width: 0; }
.sidebar-user .meta b { display: block; font-size: 14px; }
.sidebar-user .meta span { display: block; font-size: 12.5px; color: var(--text-3); }

/* main + views */
.main { flex: 1; min-width: 0; position: relative; display: flex; justify-content: center; }
.view { width: 100%; height: 100%; display: none; }
.view.active { display: block; }
.view-scroll { height: 100%; overflow-y: auto; padding-bottom: calc(var(--nav-h) + 22px); }

/* phone column — centred in whatever block container it sits in */
.phone-col {
  width: 100%; max-width: var(--feed-w);
  margin-inline: auto;
  border-left: 1px solid transparent; border-right: 1px solid transparent;
}
@media (min-width: 900px) {
  .phone-col { border-color: var(--line); background: rgba(8,8,13,.4); }
}

/* top bar inside views */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  background: rgba(8,8,13,.82); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar h2 { margin: 0; font-size: 19px; }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: var(--r-pill); flex: none;
  display: grid; place-items: center; color: var(--text-2);
  transition: background .18s, color .18s, transform .16s var(--ease);
}
.icon-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 22px; height: 22px; }

/* bottom nav (mobile) */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-around;
  background: rgba(10,10,16,.9); backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav .nav-item { flex-direction: column; gap: 3px; padding: 6px 12px; font-size: 10.5px; font-weight: 600; border-radius: var(--r-sm); }
.bottomnav .nav-item.active { background: none; color: var(--accent-3); }
.bottomnav .nav-item.active::before { display: none; }
.bottomnav .nav-item svg { width: 24px; height: 24px; }
.create-btn {
  width: 47px; height: 33px; border-radius: 11px; flex: none;
  background: var(--grad-brand);
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(124,92,255,.45);
}
.create-btn svg { width: 21px; height: 21px; color: #fff; }

.badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
  background: var(--accent-2); color: #fff;
  font-size: 10.5px; font-weight: 700;
  display: grid; place-items: center; line-height: 1;
}
.badge.dot { min-width: 9px; height: 9px; padding: 0; }

@media (min-width: 1000px) {
  .sidebar { display: flex; }
  .bottomnav { display: none; }
  .view-scroll { padding-bottom: 26px; }
}

/* ==========================================================================
   FEED
   ========================================================================== */
.feed-wrap { position: relative; height: 100%; }

.feed-tabs {
  position: absolute; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; gap: 20px; justify-content: center;
  /* right padding reserves room for the floating search / messages shortcuts
     so the last tab can never slide underneath them */
  padding: 14px 96px 26px 16px;
  background: linear-gradient(180deg, rgba(8,8,13,.86) 12%, transparent);
  pointer-events: none;
}
.feed-tabs button {
  pointer-events: auto;
  font-family: 'Space Grotesk'; font-size: 15.5px; font-weight: 600;
  color: rgba(255,255,255,.55); padding: 4px 2px; position: relative;
  transition: color .2s;
}
.feed-tabs button.active { color: #fff; }
.feed-tabs button.active::after {
  content:''; position: absolute; left: 50%; transform: translateX(-50%);
  bottom: -5px; width: 20px; height: 3px; border-radius: 3px; background: var(--grad-brand);
}

.feed {
  height: 100%; overflow-y: auto; scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.slide {
  position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  background: #000; overflow: hidden;
  display: grid; place-items: center;
}
.slide-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.slide-meme { object-fit: contain; background: #05050A; }
.slide-shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, transparent 22%, transparent 52%, rgba(0,0,0,.78) 100%); }

.slide-tap { position: absolute; inset: 0; z-index: 5; }

.slide-bottom { position: absolute; left: 0; right: 76px; bottom: 18px; z-index: 10; padding: 0 16px; }
.slide-author { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.slide-author .name { font-weight: 700; font-size: 15.5px; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.slide-author .sub { font-size: 12px; color: rgba(255,255,255,.72); }
.follow-chip {
  padding: 5px 13px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700;
  border: 1.5px solid rgba(255,255,255,.85); color: #fff; backdrop-filter: blur(6px);
  transition: transform .16s var(--ease), background .2s, color .2s;
}
.follow-chip:active { transform: scale(.93); }
.follow-chip.following { border-color: transparent; background: rgba(255,255,255,.18); color: rgba(255,255,255,.9); }

.slide-caption { font-size: 14.5px; line-height: 1.42; text-shadow: 0 1px 8px rgba(0,0,0,.72); margin-bottom: 7px; }
.slide-caption .tag { color: var(--accent-3); font-weight: 600; }
.slide-sound { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: rgba(255,255,255,.86); }
.slide-sound svg { width: 14px; height: 14px; flex: none; }
.marquee { overflow: hidden; white-space: nowrap; max-width: 190px; }
.marquee span { display: inline-block; }
/* only set by JS once the label is measured as overflowing */
.marquee span.scrolling { padding-right: 26px; animation: slide-x 11s linear infinite; }
@keyframes slide-x { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* action rail */
.rail { position: absolute; right: 8px; bottom: 22px; z-index: 12; display: flex; flex-direction: column; gap: 15px; align-items: center; }
.rail-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #fff; }
.rail-btn .ico {
  width: 43px; height: 43px; border-radius: var(--r-pill);
  display: grid; place-items: center;
  background: rgba(20,20,30,.5); backdrop-filter: blur(10px);
  transition: transform .18s var(--ease), background .2s;
}
.rail-btn:active .ico { transform: scale(.86); }
.rail-btn .ico svg { width: 23px; height: 23px; }
.rail-btn .n { font-size: 11.5px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.rail-btn.on .ico svg { color: var(--accent-2); }
.rail-btn.on.save .ico svg { color: var(--accent-4); }
.rail-btn.on .ico { animation: pop .34s var(--ease); }
@keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.24)} 100%{transform:scale(1)} }

.rail-avatar { position: relative; margin-bottom: 2px; }
.rail-avatar .plus {
  position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 20px; border-radius: 99px; background: var(--accent-2);
  display: grid; place-items: center; border: 2px solid #0b0b12;
}
.rail-avatar .plus svg { width: 12px; height: 12px; color: #fff; }

.spin-disc {
  width: 43px; height: 43px; border-radius: 99px; overflow: hidden;
  border: 1.5px solid rgba(255,255,255,.35);
  animation: spin 5.5s linear infinite;
  background: var(--surface-2);
}
@keyframes spin { to { transform: rotate(360deg); } }
.spin-disc.paused { animation-play-state: paused; }

.play-toggle {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 8; width: 76px; height: 76px; border-radius: 99px;
  display: grid; place-items: center;
  background: rgba(0,0,0,.42); backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .25s;
  pointer-events: none;
}
.play-toggle.show { opacity: 1; }
.play-toggle svg { width: 34px; height: 34px; color: #fff; }

/* ==========================================================================
   CARDS / GRIDS
   ========================================================================== */
.section { padding: 18px 16px 6px; }
.section-head { display: flex; align-items: center; margin-bottom: 13px; }
.section-head h3 { margin: 0; font-size: 16.5px; }
.section-head .spacer { flex: 1; }
.section-head .more { font-size: 12.5px; color: var(--accent-3); font-weight: 600; }

.hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 16px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }

.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 2px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

.tile { position: relative; aspect-ratio: 3/4; background: var(--surface-2); overflow: hidden; cursor: pointer; }
.tile img, .tile video { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.tile:hover img, .tile:hover video { transform: scale(1.07); }
.tile .tile-meta {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 18px 7px 7px; font-size: 11.5px; font-weight: 600;
  background: linear-gradient(transparent, rgba(0,0,0,.78));
  display: flex; align-items: center; gap: 9px;
}
.tile .tile-meta svg { width: 13px; height: 13px; }
.tile .kind-pill {
  position: absolute; top: 7px; left: 7px;
  padding: 3px 7px; border-radius: 7px; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.6); backdrop-filter: blur(6px); letter-spacing: .03em;
  text-transform: uppercase;
}

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 15px;
  transition: transform .2s var(--ease), border-color .2s;
}
.card.tap:active { transform: scale(.985); }

.user-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; transition: background .16s; cursor: pointer; }
.user-row:hover { background: rgba(255,255,255,.04); }
.user-row .meta { flex: 1; min-width: 0; }
.user-row .meta b { display: block; font-size: 14.5px; }
.user-row .meta span { display: block; font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.avatar { border-radius: 99px; object-fit: cover; background: var(--surface-3); flex: none; }
.avatar-ring { padding: 2px; border-radius: 99px; background: var(--grad-brand); display: inline-block; flex: none; }
.avatar-ring .avatar { border: 2px solid var(--bg); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--r-pill);
  background: rgba(255,255,255,.07); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: background .18s, transform .16s var(--ease);
}
.chip:active { transform: scale(.95); }
.chip.active { background: var(--grad-brand); border-color: transparent; color: #fff; }
.chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
.chip-scroll::-webkit-scrollbar { display: none; }

.tag-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: var(--r-pill);
  background: var(--surface); border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 600;
}
.tag-pill .cnt { color: var(--text-3); font-size: 11.5px; font-weight: 500; }

.stat-row { display: flex; gap: 22px; margin: 14px 0 4px; }
.stat { text-align: center; }
.stat b { display: block; font-family: 'Space Grotesk'; font-size: 17px; }
.stat span { font-size: 12px; color: var(--text-3); }

/* profile header */
.profile-head { padding: 18px 16px 4px; }
.profile-top { display: flex; gap: 16px; align-items: center; }
.profile-top .avatar { width: 88px; height: 88px; }
.profile-name { font-size: 21px; margin: 14px 0 2px; }
.profile-handle { color: var(--text-3); font-size: 14px; margin: 0 0 10px; }
.profile-bio { font-size: 14px; color: var(--text); white-space: pre-wrap; margin: 0 0 10px; }
.profile-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.profile-links a { font-size: 13px; color: var(--accent-3); font-weight: 600; }
.profile-actions { display: flex; gap: 9px; margin: 14px 0 6px; }
.profile-actions .btn { flex: 1; }

.tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(8,8,13,.9); backdrop-filter: blur(14px); z-index: 20; }
.tabs button {
  flex: 1; padding: 13px 4px; font-size: 13.5px; font-weight: 600; color: var(--text-3);
  border-bottom: 2px solid transparent; transition: color .2s, border-color .2s;
}
.tabs button.active { color: var(--text); border-color: var(--accent); }

.empty { text-align: center; padding: 54px 30px; color: var(--text-3); }
.empty .ico { width: 62px; height: 62px; margin: 0 auto 14px; border-radius: 20px;
  display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.empty .ico svg { width: 28px; height: 28px; color: var(--text-3); }
.empty h4 { margin: 0 0 6px; color: var(--text-2); font-size: 15.5px; }
.empty p { margin: 0; font-size: 13.5px; }

/* ==========================================================================
   SHEETS / MODALS
   ========================================================================== */
.scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.66); backdrop-filter: blur(3px);
  opacity: 0; transition: opacity .26s;
}
.scrim.show { opacity: 1; }

.sheet {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(102%);
  bottom: 0; z-index: 210;
  width: 100%; max-width: var(--feed-w);
  max-height: 88vh;
  background: var(--bg-2);
  border: 1px solid var(--line); border-bottom: 0;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  display: flex; flex-direction: column;
  transition: transform .34s var(--ease);
  box-shadow: 0 -20px 60px rgba(0,0,0,.6);
}
.sheet.show { transform: translateX(-50%) translateY(0); }
.sheet-grab { width: 42px; height: 4px; border-radius: 4px; background: var(--surface-3); margin: 10px auto 4px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; border-bottom: 1px solid var(--line); flex: none; }
.sheet-head h3 { margin: 0; font-size: 16px; flex: 1; }
.sheet-body { flex: 1; overflow-y: auto; padding: 8px 0 14px; }
.sheet-foot { flex: none; border-top: 1px solid var(--line); padding: 11px 14px calc(11px + env(safe-area-inset-bottom)); background: var(--bg-2); }

.center-modal {
  position: fixed; z-index: 210; left: 50%; top: 50%;
  transform: translate(-50%,-50%) scale(.94);
  width: calc(100% - 34px); max-width: 460px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r-xl); padding: 24px;
  box-shadow: var(--shadow); opacity: 0;
  transition: opacity .24s, transform .3s var(--ease);
  max-height: 88vh; overflow-y: auto;
}
.center-modal.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

.menu { padding: 6px 0; }
.menu button {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 14px 20px; font-size: 15px; text-align: left;
  transition: background .16s;
}
.menu button:hover { background: rgba(255,255,255,.05); }
.menu button svg { width: 20px; height: 20px; color: var(--text-2); flex: none; }
.menu button.danger { color: #ff8080; }
.menu button.danger svg { color: #ff8080; }

/* comments */
.comment { display: flex; gap: 11px; padding: 11px 16px; }
.comment .body { flex: 1; min-width: 0; }
.comment .who { font-size: 13px; color: var(--text-3); margin-bottom: 2px; }
.comment .who b { color: var(--text-2); font-weight: 600; }
.comment .text { font-size: 14.5px; line-height: 1.45; word-break: break-word; }
.comment .text .mention { color: var(--accent-3); font-weight: 600; }
.comment .actions { display: flex; align-items: center; gap: 16px; margin-top: 5px; font-size: 12px; color: var(--text-3); }
.comment .actions button { font-size: 12px; font-weight: 600; color: var(--text-3); transition: color .18s; }
.comment .actions button:hover { color: var(--text); }
.comment .actions button.liked { color: var(--accent-2); }
.comment .replies { margin-top: 8px; padding-left: 14px; border-left: 2px solid var(--line); }
.comment .like-col { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; color: var(--text-3); }
.comment .like-col svg { width: 16px; height: 16px; }
.comment .like-col.liked { color: var(--accent-2); }
.comment .like-col span { font-size: 10.5px; }

.comment-bar { display: flex; gap: 10px; align-items: flex-end; }
.comment-bar .input { flex: 1; border-radius: var(--r-pill); padding: 11px 16px; }
.emoji-row { display: flex; gap: 2px; overflow-x: auto; padding: 0 0 9px; scrollbar-width: none; }
.emoji-row::-webkit-scrollbar { display: none; }
.emoji-row button { font-size: 21px; padding: 3px 6px; border-radius: 9px; transition: background .16s, transform .16s; }
.emoji-row button:hover { background: rgba(255,255,255,.08); transform: scale(1.16); }

/* notifications */
.notif { display: flex; gap: 12px; padding: 13px 16px; transition: background .16s; cursor: pointer; }
.notif:hover { background: rgba(255,255,255,.035); }
.notif.unread { background: rgba(124,92,255,.075); }
.notif .ico-wrap { position: relative; flex: none; }
.notif .kind {
  position: absolute; right: -3px; bottom: -3px;
  width: 21px; height: 21px; border-radius: 99px; display: grid; place-items: center;
  border: 2px solid var(--bg); color: #fff;
}
.notif .kind svg { width: 11px; height: 11px; }
.kind.follow { background: var(--accent); }
.kind.like_post, .kind.like_comment { background: var(--accent-2); }
.kind.comment, .kind.reply { background: var(--accent-3); }
.kind.mention { background: var(--accent-4); }
.kind.share { background: #4DA3FF; }
.notif .body { flex: 1; min-width: 0; font-size: 14px; }
.notif .body b { font-weight: 600; }
.notif .when { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.notif .thumb { width: 46px; height: 60px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-3); }

.day-label { padding: 16px 16px 7px; font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; }

/* messages */
.dm-layout { display: flex; height: 100%; }
.dm-list { width: 100%; border-right: 1px solid var(--line); overflow-y: auto; }
.dm-thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.dm-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 9px; }
.msg { max-width: 74%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; word-break: break-word; }
.msg.me { align-self: flex-end; background: var(--grad-brand); color: #fff; border-bottom-right-radius: 5px; }
.msg.them { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 5px; }
.msg .when { font-size: 10.5px; opacity: .65; margin-top: 4px; }
.msg-shared { padding: 0; overflow: hidden; width: 190px; }
.msg-shared img { width: 100%; height: 190px; object-fit: cover; }
.msg-shared .cap { padding: 8px 11px; font-size: 12.5px; }

/* create */
/* The dropzone is a real <button> now, so it needs the browser's default
   button chrome cleared before it can be styled. */
.dropzone {
  width: 100%; display: block; font: inherit; color: inherit;
  background: none; text-align: center; cursor: pointer;
  border: 2px dashed var(--line-2); border-radius: var(--r-lg);
  padding: 34px 20px;
  transition: border-color .2s, background .2s;
}
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: rgba(124,92,255,.07); }
.dropzone .dz-icon { display: grid; place-items: center; margin-bottom: 10px; }
.dropzone svg { width: 30px; height: 30px; color: var(--accent); }
.dropzone b { display: block; font-size: 15px; margin-bottom: 4px; }
.dropzone span { font-size: 12.5px; color: var(--text-3); }

/* Upload action in the Create top bar. */
.btn-upload {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--r-pill);
  border: 1px solid var(--line-2); background: rgba(124,92,255,.14);
  color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer;
  transition: background .18s, border-color .18s, transform .16s var(--ease);
}
.btn-upload:hover { background: rgba(124,92,255,.26); border-color: var(--accent); }
.btn-upload:active { transform: scale(.96); }
.btn-upload svg { width: 16px; height: 16px; }

.preview-box { position: relative; border-radius: var(--r-lg); overflow: hidden; background: #000; }
.preview-box video, .preview-box img { width: 100%; max-height: 46vh; object-fit: contain; }
.preview-box .rm {
  position: absolute; top: 10px; right: 10px;
  width: 32px; height: 32px; border-radius: 99px; background: rgba(0,0,0,.66);
  display: grid; place-items: center;
}
.preview-box .rm svg { width: 16px; height: 16px; }

.seg { display: flex; background: var(--surface-2); border-radius: var(--r-md); padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: var(--text-3); transition: background .2s, color .2s; }
.seg button.active { background: var(--surface-3); color: var(--text); }

.progress { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--grad-brand); width: 0; transition: width .25s; }

.switch { position: relative; width: 46px; height: 27px; border-radius: 99px; background: var(--surface-3); transition: background .22s; flex: none; }
.switch.on { background: var(--accent); }
.switch::after { content:''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 99px; background: #fff; transition: transform .22s var(--ease); }
.switch.on::after { transform: translateX(19px); }

.settings-row { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid var(--line); }
.settings-row .meta { flex: 1; }
.settings-row .meta b { display: block; font-size: 14.5px; font-weight: 600; }
.settings-row .meta span { font-size: 12.5px; color: var(--text-3); }
.settings-row svg.lead { width: 21px; height: 21px; color: var(--text-2); flex: none; }

/* toasts */
#toast-root { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px); z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast {
  padding: 11px 18px; border-radius: var(--r-pill);
  background: rgba(28,28,42,.97); border: 1px solid var(--line-2);
  font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-sm);
  animation: toast-in .3s var(--ease);
}
.toast.err { background: rgba(60,20,26,.97); border-color: rgba(255,77,77,.4); color: #ffc0c0; }
.toast.ok { background: rgba(16,48,42,.97); border-color: rgba(34,224,184,.4); color: #9ff0dd; }
@keyframes toast-in { from { opacity:0; transform: translateY(14px); } }

/* skeleton */
.skel { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 220% 100%; animation: shimmer 1.4s infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 220% 0; } to { background-position: -60% 0; } }

.spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,.22); border-top-color: #fff; border-radius: 99px; animation: spin .75s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (max-width: 430px) {
  .feed-tabs { gap: 13px; padding: 12px 88px 24px 12px; }
  .feed-tabs button { font-size: 14px; }
}

/* 360px-class phones: the four tabs plus two floating shortcuts is genuinely
   tight, so shrink the type and reserve more room on the right. */
@media (max-width: 380px) {
  .feed-tabs { gap: 9px; padding: 12px 100px 22px 10px; }
  .feed-tabs button { font-size: 13px; }
  .phone-col > div[style*="position: absolute"] .icon-btn { width: 36px; height: 36px; }
}

@media (max-width: 400px) {
  .slide-bottom { right: 68px; }
  .rail-btn .ico { width: 40px; height: 40px; }
}

/* ---------------------------------------------------------------------------
   Mobile overlay clearance — MUST stay last in this file.
   On mobile the bottom nav floats over a full-bleed video, so the caption,
   sound row and action rail have to sit above it. Desktop has no bottom nav.
   --------------------------------------------------------------------------- */
@media (max-width: 999px) {
  .slide-bottom { bottom: calc(var(--nav-h) + 12px); }
  .rail { bottom: calc(var(--nav-h) + 16px); }
}


/* ==========================================================================
   CALLS — fullscreen overlay for incoming and active voice/video calls
   ========================================================================== */
#call-root {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: none;
  background: radial-gradient(120% 90% at 50% 0%, #1B1B2E 0%, #08080D 62%);
}
#call-root.show { display: block; }

.call-stage { position: absolute; inset: 0; background: #000; overflow: hidden; }

/* The remote feed fills the screen; our own camera sits in a corner. */
.call-remote {
  width: 100%; height: 100%; object-fit: cover; background: #000;
  transform: translateZ(0);
}
.call-local {
  position: absolute; right: 14px; bottom: 132px;
  width: 108px; height: 152px; object-fit: cover;
  border-radius: 14px; border: 1.5px solid rgba(255,255,255,.22);
  background: #14141F; z-index: 2;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
  transform: scaleX(-1);   /* mirror, like every other front camera */
}

.call-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 40px;
  display: flex; align-items: baseline; gap: 10px;
  background: linear-gradient(180deg, rgba(0,0,0,.65), transparent);
  color: #fff;
}
.call-top b { font-size: 16px; }
.call-timer { font-size: 14px; color: rgba(255,255,255,.72); font-variant-numeric: tabular-nums; }

.call-incoming {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 40px; text-align: center; color: #fff;
}
.call-avatar {
  width: 108px; height: 108px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 44px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2, #FF4D8D));
  box-shadow: 0 0 0 0 rgba(124,92,255,.55);
  animation: callPulse 1.9s ease-out infinite;
}
@keyframes callPulse {
  0%   { box-shadow: 0 0 0 0 rgba(124,92,255,.55); }
  70%  { box-shadow: 0 0 0 26px rgba(124,92,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(124,92,255,0); }
}
.call-name  { font-size: 24px; font-weight: 700; }
.call-status{ color: var(--text-2); font-size: 15px; }

.call-controls {
  position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
  z-index: 4;
  display: flex; align-items: center; justify-content: center; gap: 26px;
}
.call-btn {
  width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; color: #fff;
  background: rgba(255,255,255,.16); backdrop-filter: blur(10px);
  transition: transform .12s ease, background .12s ease;
}
.call-btn:hover  { background: rgba(255,255,255,.24); }
.call-btn:active { transform: scale(.93); }
.call-btn.off    { background: #fff; color: #08080D; }
.call-btn.end    { background: #FF3B5C; }
.call-btn.accept { background: #22E0B8; color: #08080D; }

/* Call entries inside a DM thread */
.call-row {
  display: flex; align-items: center; gap: 11px;
  margin: 10px 16px; padding: 11px 13px;
  border-radius: 13px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.07);
}
.call-row .meta { display: flex; flex-direction: column; line-height: 1.35; flex: 1; min-width: 0; }
.call-row .meta b { font-size: 13.5px; font-weight: 600; }
.call-row .meta span { font-size: 12px; color: var(--text-3); }
.call-row.missed .meta b { color: #FF6B8A; }

@media (max-width: 420px) {
  .call-local { width: 92px; height: 128px; bottom: 120px; right: 10px; }
  .call-btn   { width: 56px; height: 56px; }
  .call-controls { gap: 20px; }
}

/* ------------------------------------------------------------- checkbox */
.checkbox-row {
  display: flex; align-items: flex-start; gap: 11px;
  margin: 4px 0 18px; cursor: pointer; user-select: none;
  padding: 2px 0;
}
.checkbox-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.checkbox {
  flex: none; width: 21px; height: 21px; margin-top: 1px;
  border-radius: 6px; border: 1.6px solid var(--surface-3);
  background: transparent; display: grid; place-items: center;
  color: transparent; transition: background .16s, border-color .16s, color .16s;
}
.checkbox.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.checkbox-tick { display: grid; place-items: center; line-height: 0; }
.checkbox-text { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }
.checkbox-text small { color: var(--text-3); font-size: 11.5px; line-height: 1.4; }

/* ================================================================ MUSIC */
.music-pick {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 13px; border-radius: 13px; cursor: pointer; text-align: left;
  background: var(--surface-2, rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.09); color: inherit;
  transition: border-color .16s, background .16s;
}
.music-pick:hover { border-color: var(--accent); }
.music-pick.has { border-color: var(--accent); background: rgba(124,92,255,.10); }
.music-pick-icon {
  flex: none; width: 38px; height: 38px; border-radius: 9px; overflow: hidden;
  display: grid; place-items: center; background: var(--surface-3);
  color: var(--text-2);
}
.music-pick-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.music-pick-text b { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-pick-text small { font-size: 11.5px; color: var(--text-3); }
.music-pick-chev { flex: none; color: var(--text-3); display: grid; place-items: center; }

/* picker sheet */
.music-results { margin-top: 12px; max-height: 46vh; overflow-y: auto; }
.music-row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 8px; border: 0; border-radius: 11px; cursor: pointer;
  background: transparent; color: inherit; text-align: left;
}
.music-row:hover { background: rgba(255,255,255,.06); }
.music-art {
  flex: none; width: 46px; height: 46px; border-radius: 8px; overflow: hidden;
  background: var(--surface-3); display: grid; place-items: center; color: var(--text-3);
}
.music-art img { width: 100%; height: 100%; object-fit: cover; }
.music-meta { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.music-meta b { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-meta small { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-preview {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(255,255,255,.08); color: #fff;
}
.music-preview:hover { background: var(--accent); }

/* playable sound row on a post */
.slide-sound.playable { cursor: pointer; }
.slide-sound.playable:hover { opacity: 1; }
.slide-sound.playing { color: var(--accent-3); }
.slide-sound .sound-icon { display: grid; place-items: center; flex: none; }

/* now-playing bar */
#now-playing {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
  z-index: 700; width: min(440px, calc(100vw - 24px));
  display: none; align-items: center; gap: 11px;
  padding: 9px 11px; border-radius: 15px;
  background: rgba(20,20,31,.94); backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 12px 34px rgba(0,0,0,.45);
  opacity: 0; transition: opacity .2s, transform .2s;
}
#now-playing.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
.np-art {
  flex: none; width: 38px; height: 38px; border-radius: 9px; overflow: hidden;
  background: var(--surface-3); display: grid; place-items: center; color: var(--text-3);
}
.np-art img { width: 100%; height: 100%; object-fit: cover; }

var ZONK_DATA = (function () {
/* ==========================================================================
   ZONK · data layer
   Thin, typed-ish wrapper over Supabase (Auth + Postgres + Storage + Realtime).
   Every screen talks to `Zonk`, never to the raw client.
   ========================================================================== */


const cfg = window.ZONK_CONFIG || {};

function baseUrl(raw) {
  if (!raw) return '';
  return String(raw).trim().replace(/\/+$/, '').replace(/\/(rest|auth|storage|realtime)\/v1$/i, '');
}

/**
 * supabase-js serialises auth-token access across tabs with the Web Locks API.
 * It feature-detects `navigator.locks` — but that object can EXIST while
 * `request()` is refused outright, which is what happens in an opaque origin:
 * a sandboxed iframe (any in-app preview panel) or some file:// contexts.
 * supabase-js does not catch that, so `getSession()` rejects and every call
 * fails with:
 *     SecurityError: Failed to execute 'request' on 'LockManager':
 *     Access to the Locks API is denied in this context.
 *
 * This lock mirrors the default behaviour, but if the request is refused before
 * the callback ever ran, it falls back to running unserialised. We lose
 * cross-tab serialisation in that case — session storage itself still works, so
 * auth keeps functioning instead of dying.
 */
/* ------------------------------------------------------- remember me
 *
 * supabase-js always persists the session to localStorage, which means
 * "remember me" has nothing to switch off. Routing storage through this adapter
 * gives the checkbox real meaning:
 *
 *   remember  = true   -> localStorage    (survives closing the browser)
 *   remember  = false  -> sessionStorage  (gone when the browser closes)
 *
 * setItem clears the *other* store first, so switching the option can never
 * leave a stale token behind that quietly keeps someone signed in.
 */
const REMEMBER_KEY = 'zonk.remember-me';
const EMAIL_KEY = 'zonk.last-email';

/* Reading `window.localStorage` THROWS in an opaque origin (a sandboxed iframe
 * without allow-same-origin) — the property access itself is the failure, not
 * the method call. So it has to happen *inside* the try, never at the call
 * site: `safe(localStorage)` would evaluate localStorage first and throw
 * before `safe` ran at all.
 *
 * When neither store is reachable we fall back to memory. Sign-in still works
 * for the life of the page; it just cannot survive a reload. */
function store(name) {
  try { return window[name] || null; } catch { return null; }
}

const hasWebStorage = !!(store('localStorage') || store('sessionStorage'));
const memory = new Map();

function readFlag(key, fallback) {
  try {
    const v = store('localStorage')?.getItem(key);
    return v == null ? fallback : v === '1';
  } catch { return fallback; }
}

// Default to remembered, so existing signed-in users are unaffected by the switch.
let rememberMe = readFlag(REMEMBER_KEY, true);

const authStorage = {
  getItem(key) {
    const primary = store(rememberMe ? 'localStorage' : 'sessionStorage');
    try { return primary?.getItem(key) ?? (memory.has(key) ? memory.get(key) : null); }
    catch { return memory.has(key) ? memory.get(key) : null; }
  },
  setItem(key, value) {
    memory.set(key, value);
    const primary = store(rememberMe ? 'localStorage' : 'sessionStorage');
    const other = store(rememberMe ? 'sessionStorage' : 'localStorage');
    try { other?.removeItem(key); } catch {}
    try { primary?.setItem(key, value); } catch {}
  },
  removeItem(key) {
    memory.delete(key);
    for (const name of ['localStorage', 'sessionStorage']) {
      try { store(name)?.removeItem(key); } catch {}
    }
  }
};



let locksBroken = false;

function lockFailed(err) {
  locksBroken = true;
  console.warn('[zonk] Web Locks unavailable (sandboxed frame?), continuing without cross-tab locking:', err?.message || err);
}

function safeLock(name, acquireTimeout, fn) {
  if (locksBroken) return Promise.resolve().then(fn);

  const lm = typeof navigator !== 'undefined' ? navigator.locks : null;
  if (!lm || typeof lm.request !== 'function') return Promise.resolve().then(fn);

  let started = false;
  const opts = acquireTimeout === 0
    ? { mode: 'exclusive', ifAvailable: true }
    : { mode: 'exclusive' };

  let pending;
  try {
    // Some engines THROW here rather than returning a rejected promise when the
    // context denies the Locks API. Without this try/catch the exception escapes
    // past .catch() below and kills the caller — which is exactly how this
    // surfaced as "You're signed in, but the backend did not answer".
    pending = lm.request(name, opts, (lock) => {
      if (acquireTimeout === 0 && !lock) return undefined;
      started = true;
      return fn();
    });
  } catch (err) {
    lockFailed(err);
    return Promise.resolve().then(fn);
  }

  return Promise.resolve(pending).catch((err) => {
    // The callback already ran — this is a real error from inside fn().
    if (started) throw err;
    lockFailed(err);
    return fn();
  });
}

// Best-effort probe: establish once, up front, whether this context allows the
// Locks API, so later calls skip it entirely rather than failing and recovering.
(async () => {
  try {
    if (typeof navigator !== 'undefined' && navigator.locks?.request) {
      await navigator.locks.request('__zonk_lock_probe__', () => {});
    }
  } catch (err) {
    lockFailed(err);
  }
})();

const supabase = supabaseLib.createClient(baseUrl(cfg.SUPABASE_URL), cfg.SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: authStorage,
    lock: safeLock
  },
  realtime: { params: { eventsPerSecond: 5 } }
});

const isConfigured = () => !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);

const MEDIA_BUCKET = 'zonk-media';
const AVATAR_BUCKET = 'zonk-avatars';

/* ---------------------------------------------------------------- helpers */
function unwrap({ data, error }) {
  if (error) throw error;
  return data;
}

/**
 * Turn a raw storage error into something a person can act on.
 *
 * Upload failures are the worst kind of opaque: the SDK hands back a generic
 * "new row violates row-level security policy" for a policy problem, a
 * differently-worded 413 for a size problem, and a bare status for a full
 * bucket. Each one has a completely different fix, so say which it is.
 */
function uploadError(error, file) {
  const msg = `${error?.message || error} ${error?.statusCode || ''}`.trim();
  const mb = (file?.size / 1048576).toFixed(0);

  if (/row-level security|not authorized|unauthorized|403/i.test(msg)) {
    return 'Upload refused by the storage policy. Re-run ZONK-SETUP.sql in Supabase — the bucket policies need updating.';
  }
  if (/exceeded the maximum allowed size|entity too large|too large|413/i.test(msg)) {
    return `That file is ${mb} MB, which is over the bucket limit. Trim the video or lower the recording quality.`;
  }
  if (/duplicate|already exists|409/i.test(msg)) {
    return 'A file with that name already exists. Try again.';
  }
  if (/quota|storage.*full|insufficient|402/i.test(msg)) {
    return 'Your Supabase storage is full. Delete some posts, or upgrade the project.';
  }
  if (/mime|content.?type|not supported/i.test(msg)) {
    return `That file type (${file?.type || 'unknown'}) is not allowed.`;
  }
  if (/failed to fetch|network|load failed/i.test(msg)) {
    return 'Could not reach storage — check your internet connection and try again.';
  }
  return error?.message || 'Upload failed.';
}

function safeName(name = 'file') {
  const ext = (name.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
  return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}${ext}`;
}

function parseHashtags(text = '') {
  const out = [];
  const re = /#([\p{L}\p{N}_]{1,50})/gu;
  let m;
  while ((m = re.exec(text))) out.push(m[1].toLowerCase());
  return [...new Set(out)];
}

function extractMentions(text = '') {
  const re = /@([a-zA-Z0-9_.]{2,30})/g;
  const out = new Set();
  let m;
  while ((m = re.exec(text))) out.add(m[1].toLowerCase());
  return [...out];
}

/* --------------------------------------------------- auth URL plumbing */
/**
 * A real http(s) URL we can be redirected back to after an email link.
 * Returns null on file:// — Supabase cannot redirect to a file URL, and
 * passing one makes it silently fall back to the project's Site URL.
 */
function httpOrigin() {
  if (typeof location === 'undefined') return null;
  if (!/^https?:$/.test(location.protocol)) return null;
  return location.origin + location.pathname;
}

/**
 * Supabase reports a failed email link by putting error params in the URL hash
 * (e.g. #error=access_denied&error_code=otp_expired). supabase-js then throws
 * when it tries to consume them, so detect and clear this BEFORE initialising.
 */
function authUrlError() {
  const raw = (typeof location !== 'undefined' ? location.hash || '' : '').replace(/^#/, '');
  if (!raw || !/(^|&)error(_code)?=/.test(raw)) return null;
  const p = new URLSearchParams(raw);
  const code = p.get('error_code') || p.get('error');
  if (!code) return null;
  return {
    code,
    description: (p.get('error_description') || '').replace(/\+/g, ' '),
    raw
  };
}

function clearUrlAuthError() {
  if (typeof history === 'undefined') return;
  if (!authUrlError()) return;
  try { history.replaceState(null, '', location.pathname + location.search); }
  catch { location.hash = ''; }
}

/* ============================================================== AUTH */
const auth = {
  async session() {
    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;
    return data.session;
  },
  onChange(cb) {
    const { data } = supabase.auth.onAuthStateChange((_e, s) => cb(s));
    return () => data.subscription.unsubscribe();
  },
  async signUp({ email, password, username, displayName }) {
    const redirect = httpOrigin();
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: { username: username?.toLowerCase(), display_name: displayName || username },
        // Only send this when we actually have a routable URL. Sending a
        // file:// URL makes Supabase fall back to the project Site URL.
        ...(redirect ? { emailRedirectTo: redirect } : {})
      }
    });
    if (error) throw error;
    return data;
  },

  /** Re-send the sign-up confirmation email (for expired / lost links). */
  async resendConfirmation(email) {
    const redirect = httpOrigin();
    const { error } = await supabase.auth.resend({
      type: 'signup',
      email,
      ...(redirect ? { options: { emailRedirectTo: redirect } } : {})
    });
    if (error) throw error;
  },

  /** True when we're on file:// and therefore cannot receive email redirects. */
  canReceiveRedirects: () => !!httpOrigin(),

  /**
   * Choose where the session lives. Must be called BEFORE signing in, because
   * that is the moment the token is written.
   */
  setRemember(value) {
    rememberMe = !!value;
    try { localStorage.setItem(REMEMBER_KEY, rememberMe ? '1' : '0'); } catch {}
    if (!rememberMe) this.setLastEmail('');
  },

  getRemember: () => rememberMe,

  /** The email to prefill on the login form. */
  lastEmail() {
    try { return localStorage.getItem(EMAIL_KEY) || ''; } catch { return ''; }
  },

  setLastEmail(email) {
    try {
      if (email) localStorage.setItem(EMAIL_KEY, email);
      else localStorage.removeItem(EMAIL_KEY);
    } catch {}
  },

  /** Forget the stored session on this device. */
  forgetDevice() {
    try { localStorage.removeItem(EMAIL_KEY); localStorage.removeItem(REMEMBER_KEY); } catch {}
  },
  async signIn({ email, password }) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data;
  },
  async signOut() {
    const { error } = await supabase.auth.signOut();
    if (error) throw error;
  },
  async resetPassword(email) {
    const redirect = httpOrigin();
    const { error } = await supabase.auth.resetPasswordForEmail(email,
      redirect ? { redirectTo: redirect } : undefined);
    if (error) throw error;
  },
  async updatePassword(password) {
    const { error } = await supabase.auth.updateUser({ password });
    if (error) throw error;
  },
  async usernameAvailable(username) {
    if (!/^[a-z0-9_.]{3,24}$/.test(username)) return false;
    const { data, error } = await supabase.rpc('username_available', { p_username: username });
    if (error) {
      // fall back to a direct read if the RPC is missing
      const { data: row } = await supabase.from('profiles').select('id').eq('username', username).maybeSingle();
      return !row;
    }
    return !!data;
  }
};

  },
  async byIds(ids = []) {
    if (!ids.length) return [];
    return unwrap(await supabase.from('profiles').select('*').in('id', ids));

  async search(q, limit = 24) {
    const term = `%${q.replace(/[%_]/g, '')}%`;
    return unwrap(await supabase.from('profiles').select('*')

  async popular(limit = 20) {

  },
  async followers(userId) {
    return unwrap(await supabase.from('follows')

  async uploadAvatar(userId, file) {
    const path = `${userId}/${safeName(file.name || 'avatar.jpg')}`;
    const { error } = await supabase.storage.from(AVATAR_BUCKET).upload(path, file, { upsert: true, cacheControl: '3600' });
    if (error) throw error;
    return supabase.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
  }
};

/* ============================================================= POSTS */
const POST_SELECT = '*, author:profiles!posts_author_id_fkey(*), sound:sounds(*)';

const posts = {
  async create({ authorId, kind, mediaUrl, thumbUrl, caption, soundId, taggedUsers = [], visibility = 'public' }) {
    const hashtags = parseHashtags(caption || '');
    return unwrap(await supabase.from('posts').insert({
      author_id: authorId, kind, media_url: mediaUrl, thumb_url: thumbUrl || null,
      caption: caption || '', hashtags, sound_id: soundId || null,
      tagged_users: taggedUsers, visibility
    }).select(POST_SELECT).single());
  },

  async get(id) {
    return unwrap(await supabase.from('posts').select(POST_SELECT).eq('id', id).maybeSingle());
  },

  async remove(id) {
    return unwrap(await supabase.from('posts').delete().eq('id', id));
  },

  async setVisibility(id, visibility) {
    return unwrap(await supabase.from('posts').update({ visibility }).eq('id', id));
  },

  /** category: for_you | trending | following | new */
  async feed(category = 'for_you', { limit = 24, cursor = null, followingIds = [] } = {}) {
    let q = supabase.from('posts').select(POST_SELECT).eq('is_removed', false).eq('visibility', 'public');

    if (category === 'following') {
      if (!followingIds.length) return [];
      q = q.in('author_id', followingIds);
      q = q.order('created_at', { ascending: false });
    } else if (category === 'new') {
      q = q.order('created_at', { ascending: false });
    } else if (category === 'trending') {
      q = q.gte('created_at', new Date(Date.now() - 14 * 864e5).toISOString())
           .order('like_count', { ascending: false });
    } else {
      q = q.order('created_at', { ascending: false });
    }

    if (cursor) q = q.lt('created_at', cursor);
    const rows = unwrap(await q.limit(limit));

    if (category === 'for_you' || category === 'trending') {
      const age = p => (Date.now() - new Date(p.created_at).getTime()) / 36e5;
      const score = p =>
        (p.like_count * 1.0 + p.comment_count * 2.5 + p.share_count * 3.5 + p.save_count * 2.0 + p.view_count * 0.12) /
        Math.pow(age(p) + 3, 0.85);
      rows.sort((a, b) => score(b) - score(a));
    }
    return rows;
  },

  async byAuthor(authorId, kind = null, limit = 60) {
    let q = supabase.from('posts').select(POST_SELECT).eq('author_id', authorId).eq('is_removed', false);
    if (kind) q = q.eq('kind', kind);
    return unwrap(await q.order('created_at', { ascending: false }).limit(limit));
  },

  async likedBy(userId, limit = 60) {
    return unwrap(await supabase.from('likes')
      .select(`post:posts!likes_post_id_fkey(${POST_SELECT})`)
      .eq('user_id', userId).order('created_at', { ascending: false }).limit(limit))
      .map(r => r.post).filter(p => p && !p.is_removed);
  },

  async savedBy(userId, limit = 60) {
    return unwrap(await supabase.from('saves')
      .select(`post:posts!saves_post_id_fkey(${POST_SELECT})`)
      .eq('user_id', userId).order('created_at', { ascending: false }).limit(limit))
      .map(r => r.post).filter(p => p && !p.is_removed);
  },

  async byHashtag(tag, limit = 40) {
    return unwrap(await supabase.from('posts').select(POST_SELECT)
      .contains('hashtags', [tag.toLowerCase()]).eq('is_removed', false)
      .order('created_at', { ascending: false }).limit(limit));
  },

  async search(q, kind = null, limit = 40) {
    const term = `%${q.replace(/[%_]/g, '')}%`;
    let query = supabase.from('posts').select(POST_SELECT).eq('is_removed', false).ilike('caption', term);
    if (kind) query = query.eq('kind', kind);
    return unwrap(await query.order('like_count', { ascending: false }).limit(limit));
  },

  async registerView(id) {
    // fire and forget
    supabase.rpc('register_view', { p_post_id: id }).then(() => {}, () => {});
  },

  async uploadMedia(userId, file, onProgress) {
    // The first path segment IS the owner as far as the storage policy is
    // concerned (see the bucket policies in supabase-schema.sql), so it must
    // stay `<user-id>/…`.
    const path = `${userId}/${safeName(file.name)}`;
    // supabase-js has no upload progress; show an indeterminate tick.
    onProgress?.(0.15);
    const { error } = await supabase.storage.from(MEDIA_BUCKET)
      .upload(path, file, {
        cacheControl: '31536000',
        upsert: false,
        contentType: file.type || undefined
      });
    if (error) throw new Error(uploadError(error, file));
    onProgress?.(1);
    return supabase.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
  }
};

/* ============================================== LIKES / SAVES / SHARES */
const reactions = {
  async myLikes(userId) {
    return unwrap(await supabase.from('likes').select('post_id').eq('user_id', userId)).map(r => r.post_id);
  },
  async mySaves(userId) {
    return unwrap(await supabase.from('saves').select('post_id').eq('user_id', userId)).map(r => r.post_id);
  },
  async toggleLike(userId, postId, currentlyLiked) {
    if (currentlyLiked) {
      const { error } = await supabase.from('likes').delete().eq('user_id', userId).eq('post_id', postId);
      if (error) throw error;
      return false;
    }
    const { error } = await supabase.from('likes').insert({ user_id: userId, post_id: postId });
    if (error && error.code !== '23505') throw error;
    return true;
  },
  async toggleSave(userId, postId, currentlySaved) {
    if (currentlySaved) {
      const { error } = await supabase.from('saves').delete().eq('user_id', userId).eq('post_id', postId);
      if (error) throw error;
      return false;
    }
    const { error } = await supabase.from('saves').insert({ user_id: userId, post_id: postId });
    if (error && error.code !== '23505') throw error;
    return true;
  },
  async recordShare(userId, postId, channel = 'link') {
    const { error } = await supabase.from('shares').insert({ user_id: userId, post_id: postId, channel });

/* ==========================================================================
   ZONK · calls
   Voice and video calling between two users.

   HOW IT WORKS
     Media travels peer-to-peer over WebRTC. The two browsers still have to find
     each other and agree on codecs, so they need a signalling channel — that is
     Supabase Realtime broadcast, which is fast and ephemeral. Nothing about the
     call itself is stored there; the `calls` table only records what happened
     (who rang whom, answered or missed, how long).

   SIGNALLING SEQUENCE
     1. Caller opens channel `call:<callId>` and broadcasts `invite` to the
        callee's personal channel `calls:<calleeId>`.
     2. Callee shows the incoming screen. On accept it joins `call:<callId>`
        and broadcasts `accept`.
     3. Caller (already on the channel) sends the SDP `offer`.
     4. Callee replies `answer`. Both trickle `ice` candidates.
     5. Either side sends `bye` — or drops off the channel — and both hang up.

   WHY A PERSONAL CHANNEL EXISTS
     The callee has to be reachable before a call channel exists, so every
     signed-in client subscribes to `calls:<their own id>` on boot.

   LIMITS WORTH KNOWING
     Only STUN is configured. STUN lets two peers discover their public
     addresses, which is enough on most home and mobile networks, but NOT behind
     symmetric NAT or a strict corporate firewall — those need a TURN relay to
     carry the media. Add TURN credentials to ICE_SERVERS below to cover them.
     Also: WebRTC needs a secure context. http://localhost counts; a sandboxed
     preview iframe does not.

/* ------------------------------------------------------------- ICE servers
 *
 * STUN alone is enough when both people are on the same machine, the same
 * wifi, or any network with an ordinary NAT: it lets each side learn its own
 * public address so they can connect directly.
 *
 * It is NOT enough behind symmetric NAT, carrier-grade NAT (most mobile
 * networks) or a strict corporate firewall. Those need a TURN relay to carry
 * the media. Without one the call rings, ICE never completes, and both people
 * sit on "Connecting…" until they give up.
 *
 * TURN credentials come from config, not from this file:
 *
 *   window.ZONK_CONFIG = { …, TURN_URLS: ['turn:host:443'],
 *                          TURN_USERNAME: '…', TURN_CREDENTIAL: '…' }
 *
 * (build-config.mjs fills these from TURN_URLS / TURN_USERNAME /
 * TURN_CREDENTIAL. Metered's free tier is the quickest source; sign up, make a
 * credential, and paste the three values.)
 *
 * Deliberately NOT shipping the old `openrelayproject` public credentials:
 * Metered retired them, so they no longer allocate — they would just add a
 * few seconds of failed gathering to every single call.
 */
const ZC = window.ZONK_CONFIG || {};
const TURN_URLS = Array.isArray(ZC.TURN_URLS) ? ZC.TURN_URLS.filter(Boolean) : [];

const ICE_SERVERS = {
  iceServers: [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },

      ? [{ urls: TURN_URLS, username: ZC.TURN_USERNAME, credential: ZC.TURN_CREDENTIAL }]

const CONNECT_TIMEOUT_MS = 25000; // media must be flowing by now, or we quit

/* crypto.randomUUID() only exists in a secure context. On a plain http:// LAN
 * address it is missing entirely, which throws before the call can even start. */
function uuid() {
  try { if (globalThis.crypto?.randomUUID) return crypto.randomUUID(); } catch {}
  const b = new Uint8Array(16);
  try { crypto.getRandomValues(b); }
  catch { for (let i = 0; i < 16; i++) b[i] = (Math.random() * 256) | 0; }
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;

/* ------------------------------------------------------------- ringtone
 * Synthesised with the Web Audio API rather than an audio file:
 *   • nothing to host, so no 404s and no CORS to get wrong
 *   • no download, so it starts the instant the call does
 *   • the pattern is data, so it is easy to tune
 *
 * Browsers block audio until the user has interacted with the page. Starting a

 * not have touched the page since loading it — that is why ring() resumes the
 * context and silently gives up if it is still blocked, rather than throwing.

let audioCtx = null;
let ringStop = null;

function ringCtx() {

  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

/** One shaped note. `vol` is peak gain; the envelope avoids clicks. */
function note(ac, dest, freq, at, dur, vol = 0.16, type = 'sine') {
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.03);
  g.gain.setValueAtTime(vol, at + Math.max(dur - 0.06, 0.04));
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(g); g.connect(dest);
  osc.start(at);
  osc.stop(at + dur + 0.03);
}

/**
 * Loop a ring pattern until stopRing().
 *   'incoming' — brighter two-note chime, the other person is calling you
 *   'outgoing' — low single tone, you are waiting for them to pick up
 */
function startRing(kind) {
  stopRing();
  const ac = ringCtx();
  if (!ac) return;

  const master = ac.createGain();
  master.gain.value = 0.9;
  master.connect(ac.destination);

  const incoming = kind === 'incoming';
  const period = incoming ? 2.2 : 3.2;   // seconds between repeats

  const schedule = () => {
    const t = ac.currentTime + 0.06;
    if (incoming) {

      note(ac, master, 880, t, 0.16, 0.15, 'triangle');
      note(ac, master, 1174, t + 0.19, 0.22, 0.14, 'triangle');
      note(ac, master, 880, t + 0.85, 0.16, 0.15, 'triangle');
      note(ac, master, 1174, t + 1.04, 0.22, 0.14, 'triangle');
    } else {

      note(ac, master, 440, t, 0.85, 0.10, 'sine');
      note(ac, master, 480, t, 0.85, 0.06, 'sine');

  schedule();
  const iv = setInterval(schedule, period * 1000);

  // A phone buzzes too — cheap, and it makes a real difference on mobile.
  const buzz = () => { try { navigator.vibrate?.(incoming ? [400, 200, 400] : [220]); } catch {} };
  buzz();
  const vib = setInterval(buzz, period * 1000);

  ringStop = () => { clearInterval(iv); clearInterval(vib); try { navigator.vibrate?.(0); } catch {} try { master.disconnect(); } catch {} };
}

}

function newPeerConnection() {

    call.ice = call.ice || { host: 0, srflx: 0, prflx: 0, relay: 0 };

  (call.localStream || new MediaStream()).getTracks().forEach(t => pc.addTrack(t, call.localStream));

async function handleSignal(msg) {

      // invite so the caller's UI updates immediately) — accept both.
      if (call.role !== 'caller') return;
      if (call.phase !== 'inviting' && call.phase !== 'ringing') return;
      clearTimeout(call.ringTimer);
      call.phase = 'connecting';
      startConnectTimer();
      emit();
      // The callee is listening now, so send the offer.
      call.makingOffer = true;
      const offer = await call.pc.createOffer();
      await call.pc.setLocalDescription(offer);
      send({ kind: 'offer', callId: call.id, from: me, sdp: call.pc.localDescription });
      call.makingOffer = false;
      break;
    }
    case 'offer': {
      if (call.role !== 'callee') return;
      await call.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      await flushIce();
      const answer = await call.pc.createAnswer();
      await call.pc.setLocalDescription(answer);
      send({ kind: 'answer', callId: call.id, from: me, sdp: call.pc.localDescription });
      call.phase = 'connecting';
      emit();
      break;
    }
    case 'answer': {
      if (call.role !== 'caller') return;
      await call.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      await flushIce();
      break;
    }
    case 'ice': {
      const c = msg.candidate;
      if (!c) return;
      if (call.pc?.remoteDescription) {
        try { await call.pc.addIceCandidate(c); } catch (e) { console.warn('ice', e); }
      } else {
        call.pendingIce.push(c);
      }
      break;
    }
    case 'decline':
      await finish(call.role === 'caller' ? 'declined' : 'ended', call.role === 'caller' ? 'Call declined' : null);
      break;
    case 'bye':
      await finish('ended', call.role === 'callee' && call.phase === 'ringing' ? 'Missed call' : null);
      break;
  }
}

  /** Subscribe to incoming calls. Call once after sign-in. */

    me = userId;
    const name = `calls:${userId}`;
    userChannel = ZONK_DATA.supabase.channel(name, { config: { broadcast: { self: false } } });

    userChannel.on('broadcast', { event: 'signal' }, ({ payload }) => {
      if (payload?.kind === 'invite') receiveInvite(payload);
      else handleSignal(payload);
    });

    await new Promise((resolve) => {
      userChannel.subscribe((status) => { if (status === 'SUBSCRIBED') resolve(); });
      setTimeout(resolve, 4000);

  onCallChange,
  currentCall,
  isBusy,

   * Ring someone. `peer` needs at least { id, display_name, username }.
   * Resolves once the call record exists; the UI follows onCallChange.
   */
  async start({ conversationId, peer, kind = 'video' }) {
    if (call) throw new Error('You are already on a call.');
    if (!me) throw new Error('Not signed in.');

    // Fail fast on permissions, before the other person's phone starts ringing.
    const localStream = await getMedia(kind);

    const callId = uuid();
    call = makeCall({
      id: callId, kind, role: 'caller', conversationId,
      peerId: peer.id, peerName: peer.display_name || peer.username || 'User',
      localStream

    call.pc = newPeerConnection();
    call.channel = ZONK_DATA.supabase.channel(`call:${callId}`, { config: { broadcast: { self: false } } });
    call.channel.on('broadcast', { event: 'signal' }, ({ payload }) => handleSignal(payload));
    call.channelReady = new Promise((resolve) => {
      call.channel.subscribe((status) => { if (status === 'SUBSCRIBED') resolve(); });
      setTimeout(resolve, 4000);
    });
    await call.channelReady;

    // Record it, then ring. The row is what makes a missed call visible later.
    try {
      const { data } = await ZONK_DATA.supabase.from('calls').insert({
        conversation_id: conversationId, caller_id: me, callee_id: peer.id,
        kind, status: 'ringing'
      }).select().single();
      if (data?.id) call.rowId = data.id;
    } catch (e) {
      console.warn('[zonk] could not record call', e?.message || e);
    }

    call.phase = 'ringing';
    emit();

    // Ring in the background so the caller's UI updates immediately.
    // NOTE: the media type is `mediaKind`, never `kind` — `kind` is already the
    // message type here, and a duplicate key would silently overwrite it.
    sendToUser(peer.id, { kind: 'invite', callId, from: me, conversationId,
                          mediaKind: kind, fromName: call.peerName, calleeId: peer.id,
                          rowId: call.rowId })
      .catch(e => console.warn('[zonk] could not deliver invite', e?.message || e));

    call.ringTimer = setTimeout(() => {
      if (call?.phase === 'ringing' || call?.phase === 'inviting') {
        send({ kind: 'bye', callId: call.id, from: me });
        finish('missed', 'No answer');
      }
    }, RING_TIMEOUT_MS);

    return callId;
  },

  /** Callee accepts an incoming call. */
  async accept() {
    if (!call || call.role !== 'callee') return;
    clearTimeout(call.ringTimer);
    try {
      call.localStream = await getMedia(call.kind);
    } catch (e) {
      // We cannot answer without media — tell the caller rather than letting
      // them ring into silence.
      send({ kind: 'decline', callId: call.id, from: me });
      cleanup();
      notify(e?.message || 'Could not access the camera or microphone.');
      return;
    }
    call.pc = newPeerConnection();
    call.phase = 'connecting';
    await logCall({ status: 'active', answered_at: new Date().toISOString() });
    // Wait until we are really joined before accepting. If this message is lost
    // the caller waits forever for an offer that never comes.
    try { await call.channelReady; } catch {}
    startConnectTimer();
    send({ kind: 'accept', callId: call.id, from: me });
    emit();
  },

  /** Callee declines. */
  async decline() {
    if (!call) return;
    send({ kind: 'decline', callId: call.id, from: me });
    await logCall({ status: 'declined', ended_at: new Date().toISOString() });
    cleanup();
  },

  /** Either side hangs up. */
  async hangup() {
    if (!call) return;
    send({ kind: 'bye', callId: call.id, from: me });
    const status = call.phase === 'active' ? 'ended' : (call.role === 'caller' ? 'cancelled' : 'declined');
    await logCall({
      status,
      ended_at: new Date().toISOString(),
      duration_seconds: call.startedAt ? Math.round((Date.now() - call.startedAt) / 1000) : null
    });
    cleanup();
  },

  toggleMute() {
    if (!call?.localStream) return;
    call.muted = !call.muted;
    call.localStream.getAudioTracks().forEach(t => { t.enabled = !call.muted; });

  /** True while a ringtone is sounding — exposed for tests and UI. */
  isRinging: () => !!ringStop,

  toggleCam() {
    if (!call?.localStream) return;
    call.camOff = !call.camOff;
    call.localStream.getVideoTracks().forEach(t => { t.enabled = !call.camOff; });

  /** Drop the personal channel — call on sign-out. */
  teardown() {
    stopRing();
    if (call) { try { cleanup(); } catch {} }
    if (userChannel) { try { ZONK_DATA.supabase.removeChannel(userChannel); } catch {} userChannel = null; }
    me = null;
  }

/* ------------------------------------------------------------- internals */
function receiveInvite(payload) {
  if (call) {
    // Already busy — tell them so they don't sit ringing. This has to go back to
    // the caller's personal channel; we aren't on their call channel.
    sendToUser(payload.from, { kind: 'decline', callId: payload.callId, from: me, busy: true })
      .catch(() => {});
    return;
  }

  call = makeCall({
    id: payload.callId, rowId: payload.rowId || null,
    kind: payload.mediaKind || 'video', role: 'callee',
    peerId: payload.from, peerName: payload.fromName || 'Someone',
    conversationId: payload.conversationId, phase: 'ringing'
  });

  call.channel = ZONK_DATA.supabase.channel(`call:${payload.callId}`, { config: { broadcast: { self: false } } });
  call.channel.on('broadcast', { event: 'signal' }, ({ payload: p }) => handleSignal(p));

  // cannot be sent before we are actually on the channel.
  call.channelReady = new Promise((resolve) => {
    call.channel.subscribe((status) => { if (status === 'SUBSCRIBED') resolve(); });
    setTimeout(resolve, 4000);
  });
  emit();

  // If they never pick up, stop ringing on our side too.
  call.ringTimer = setTimeout(() => {
    if (call?.phase === 'ringing') finish('missed', 'Missed call');
  }, RING_TIMEOUT_MS);

/** Mark the call over, remember why, then tear down and surface a message. */
async function finish(status, notice) {
  const startedAt = call?.startedAt;
  const id = call?.rowId;
  const role = call?.role;
  if (id) {
    const finalStatus = status === 'ended' && role === 'callee' && !startedAt ? 'missed' : status;
    try {
      await ZONK_DATA.supabase.from('calls').update({
        status: finalStatus,
        ended_at: new Date().toISOString(),
        duration_seconds: startedAt ? Math.round((Date.now() - startedAt) / 1000) : null
      }).eq('id', id);
    } catch {}
  }
  cleanup();
  if (notice) notify(notice);
}

/** Same as finish() but for the local user's own hang-up. */
async function end(status) {
  await finish(status, null);
}

let noticeHandler = null;
function onCallNotice(fn) { noticeHandler = fn; }
function notify(text) { try { noticeHandler?.(text); } catch {} }

  stopRing();
  lastPhase = null;
  if (!call) return;
  clearTimeout(call.ringTimer);
  clearTimeout(call.dropTimer);
  clearTimeout(call.connectTimer);
  stopStream(call.localStream);
  try { call.pc?.close(); } catch {}
  if (call.channel) { try { ZONK_DATA.supabase.removeChannel(call.channel); } catch {} }
  call = null;
  emit();
}
